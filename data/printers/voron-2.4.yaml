schema: printer/1
id: voron-2.4
name: Voron 2.4 (R2)
manufacturer: Voron Design
status: reviewed
docs:
  - {title: "Voron 2.4 documentation", url: "https://docs.vorondesign.com/build/"}
  - {title: "Voron initial startup checks", url: "https://docs.vorondesign.com/build/startup/"}
kinematics: corexy
z_leveling: quad_gantry_level

sizes:
  - id: "250"
    bed_mm: [250, 250]
    position_max: {x: 250, y: 250, z: 210}
    quad_gantry_level:
      gantry_corners: [[-60, -10], [310, 320]]
      points: [[50, 25], [50, 175], [200, 175], [200, 25]]
  - id: "300"
    bed_mm: [300, 300]
    position_max: {x: 300, y: 300, z: 260}
    quad_gantry_level:
      gantry_corners: [[-60, -10], [360, 370]]
      points: [[50, 25], [50, 225], [250, 225], [250, 25]]
  - id: "350"
    bed_mm: [350, 350]
    position_max: {x: 350, y: 350, z: 310}
    quad_gantry_level:
      gantry_corners: [[-60, -10], [410, 420]]
      points: [[50, 25], [50, 275], [300, 275], [300, 25]]

# Logical steppers. `klipper` is the Klipper section name, `role` drives
# board slot assignment, `dir_inverted` is Voron's reference value for stock
# wiring (users still verify directions during preflight).
steppers:
  - {klipper: stepper_x,  role: B,  position: rear-left,   rotation_distance: 40, dir_inverted: true}
  - {klipper: stepper_y,  role: A,  position: rear-right,  rotation_distance: 40, dir_inverted: true}
  - {klipper: stepper_z,  role: Z0, position: front-left,  rotation_distance: 40, gear_ratio: "80:16", dir_inverted: true}
  - {klipper: stepper_z1, role: Z1, position: rear-left,   rotation_distance: 40, gear_ratio: "80:16", dir_inverted: false}
  - {klipper: stepper_z2, role: Z2, position: rear-right,  rotation_distance: 40, gear_ratio: "80:16", dir_inverted: true}
  - {klipper: stepper_z3, role: Z3, position: front-right, rotation_distance: 40, gear_ratio: "80:16", dir_inverted: false}

variants:
  - id: standard
    name: Standard (two X/Y motors)
    drivers_required: {motion: 6, extruder: 1}
  - id: awd
    name: AWD (four X/Y motors)
    drivers_required: {motion: 8, extruder: 1}
    extra_steppers:
      # Each pair sits diagonally (B rear-left + B1 front-right): LDO LeviathanExt
      # Klipper_config/v2t_leviathan_ext.cfg ("B1 Stepper - Front Right", "A1 Stepper - Front Left").
      - {klipper: stepper_x1, role: B1, position: front-right, rotation_distance: 40, pairs_with: stepper_x}
      - {klipper: stepper_y1, role: A1, position: front-left,  rotation_distance: 40, pairs_with: stepper_y}
    notes:
      - "The two extra X/Y motors at the front have no endstop switches of their own. When homing, each one simply follows its partner motor at the back."
      - "Each extra motor must turn the same way as its partner. Before the first homing, loosen the belts and run PREFLIGHT_MOTORS to check one pair at a time."
      - "Use the same motor model and driver for both motors in a pair. With sensorless homing, both motors in a pair also need the same current and sensitivity."
      - "AWD needs 9 motor sockets. Most 8-socket boards only have enough if the extruder motor runs from a toolhead board."

defaults:
  printer:
    max_velocity: 300
    max_accel: 3000
    max_z_velocity: 15
    max_z_accel: 350
    square_corner_velocity: 5.0
  stepper_xy:
    microsteps: 32
    full_steps_per_rotation: 200
    homing_speed: 25
    homing_retract_dist: 5
    homing_positive_dir: true
    position_min: 0
    endstop_at_max: true       # position_endstop = position_max
    run_current: 0.8
  stepper_z:
    microsteps: 32
    position_endstop: -0.5
    position_min: -5
    homing_speed: 8
    second_homing_speed: 3
    homing_retract_dist: 3
    run_current: 0.8
  tmc:
    interpolate: false        # Voron reference; autotune configs switch to true
    stealthchop_threshold: 0
  extruder:
    run_current: 0.5          # reference value for the stock Clockwork 2 motor
  safe_z_home:
    home_xy_position: user    # position of the Z endstop pin, per build
    speed: 100
    z_hop: 10
  quad_gantry_level:
    speed: 100
    horizontal_move_z: 10
    retries: 5
    retry_tolerance: 0.0075
    max_adjust: 10
  idle_timeout: 1800

stock:
  toolhead: stealthburner
  extruder: clockwork2
  probe_options: [omron-tl-q5mc2, voron-tap, klicky]
  z_endstop: nozzle-switch     # Voron's nozzle-pin Z endstop at the rear

notes:
- "The maximum print height is Voron's figure for its standard toolhead; a different toolhead or probe can lower it a little."
tech_notes:
- "position_max z values are Voron's reference numbers; a different toolhead or probe can change the usable height."
sources:
  - repo: https://github.com/VoronDesign/Voron-2
    path: firmware/klipper_configurations/Octopus/Voron2_Octopus_Config.cfg
    commit: a192410e27ea345644ae5c4b29b4c9c40cbe1a73
  - repo: https://github.com/MotorDynamicsLab/LeviathanExt
    path: Klipper_config/v2t_leviathan_ext.cfg
    commit: 060af34d9eecc6e967473f04f5e677e55a51dda8
    note: AWD motor positions (stepper_x1 front-right, stepper_y1 front-left; pairs are diagonal)
