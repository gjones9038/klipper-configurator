    applies_to: [robo3d-r2]
    sources:
    - {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-robo3d-r2-2017.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    note: Defined in Klipper's Robo3D R2 config as [thermistor NTCS0603E3104FXT].
