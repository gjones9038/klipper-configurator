# Imported from https://github.com/Klipper3d/klipper config/printer-creality-cr30-2021.cfg by tools/import_klipper_printer.py (only source: needs review).
schema: printer/1
id: creality-cr30
name: Creality CR-30 PrintMill
manufacturer: Creality
status: needs-review
docs:
- {title: 'Klipper: Creality CR-30 PrintMill reference config', url: 'https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr30-2021.cfg'}
- {title: 'Klipper: configuration checks (first power-on)', url: 'https://www.klipper3d.org/Config_checks.html'}
kinematics: corexy
z_leveling: null
bed_heater: unknown
belt: {homing_gcode: '{% if params.X is not defined and params.Y is not defined and params.Z is not defined %}G28 X0 Y0{%
    endif %}

    {% if params.X is defined %}G28 X0{% endif %}

    {% if params.Y is defined %}G28 Y0{% endif %}

    G92 Z0'}
hotend_fan: always_on
imported_from: {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-creality-cr30-2021.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
sizes:
- id: stock
  bed_mm: [220, 240]
  position_max: {x: 220, y: 240, z: 20000000}
steppers:
- {klipper: stepper_x, role: B, rotation_distance: 40, dir_inverted: true}
- {klipper: stepper_y, role: A, rotation_distance: 40, dir_inverted: true}
- {klipper: stepper_z, role: Z0, rotation_distance: 2.75, dir_inverted: true}
variants:
- id: standard
  name: Stock
  drivers_required: {motion: 3, extruder: 1}
defaults:
  printer: {max_velocity: 300, max_accel: 3000, max_z_velocity: 5, max_z_accel: 100}
  stepper_xy: {microsteps: 16, full_steps_per_rotation: 200, homing_speed: 50, homing_retract_dist: 5, homing_positive_dir: false,
    position_min: 0, endstop_at_max: false, position_endstop: 0, run_current: 0.58}
  axes:
    x: {endstop_at_max: false, homing_positive_dir: false, position_endstop: 0, position_min: 0, homing_speed: 50}
    y: {endstop_at_max: false, homing_positive_dir: false, position_endstop: 0, position_min: 0}
  stepper_z: {microsteps: 16, position_endstop: 0, position_min: 0, homing_speed: 5, second_homing_speed: 2.5, homing_retract_dist: 5,
    run_current: 0.58}
  tmc: {interpolate: false, stealthchop_threshold: 0}
  extruder: {run_current: 0.5}
  bed:
    max_power: 1.0
    max_temp: 130
    pid: {pid_kp: 54.027, pid_ki: 0.77, pid_kd: 948.182}
  safe_z_home: {home_xy_position: user, speed: 100, z_hop: 10}
  idle_timeout: 1800
stock:
  mainboards: [creality-cr30-board]
  toolhead: null
  extruder: creality-cr30-extruder
  hotend: creality-cr30-hotend
  thermistors: {hotend: epcos-b57560, bed: epcos-b57560}
  probe_options: []
  homing_xy: physical
  homing_z: belt
  fans: [part_cooling]
  display: {lcd_type: st7920, cs_pin: PB12, sclk_pin: PB13, sid_pin: PB15, encoder_pins: '^PB14, ^PB10', click_pin: ^!PB2}
  filament_sensors:
  - {port: FIL}
  extra_fans:
  - section: fan_generic k_fan2
    klipper: {pin: PC0}
    note: printer config
  - section: fan_generic k_fan3
    klipper: {pin: PC1}
    note: printer config
  macros:
    BED_EJECT: {description: Push the finished print off the belt (printer config)., gcode: 'TURN_OFF_HEATERS

        G28

        G1 X50 Y50

        G1 Z420 F4000

        G28 Z0'}
stock_parts:
  extruders:
  - id: creality-cr30-extruder
    name: Creality CR-30 PrintMill stock extruder
    drive: unknown
    rotation_distance: 23
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline:
      start: 0
      range: [0, 1]
    confidence: medium
    applies_to: [creality-cr30]
    sources:
    - {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-creality-cr30-2021.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    unverified: ['Klipper''s config does not say whether this is a direct-drive or Bowden extruder, so pressure advance starts
        at 0: tune it (TUNE_PA).']
    dir_inverted: true
  hotends:
  - id: creality-cr30-hotend
    name: Creality CR-30 PrintMill stock hotend
    maker: Creality
    flow_class: standard
    max_temp: 250
    max_temp_basis: hotend
    includes: {heater: true, thermistor: true}
    common_thermistor: epcos-b57560
    applies_to: [creality-cr30]
    sources:
    - {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-creality-cr30-2021.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b,
      note: '[extruder] max_temp: 250'}
    pid_seed: {pid_kp: 21.527, pid_ki: 1.063, pid_kd: 108.982}
  probes: []
  thermistors: []
notes: ['Made from Klipper''s reference config for this printer. Check the pins against your printer before powering on, and
    run PREFLIGHT first.', 'The stock motor drivers can''t be adjusted from Klipper, so the motor current settings and sensorless
    homing don''t apply.', 'A belt printer: the belt is the Z axis and never ends, so homing counts the current belt position
    as Z = 0. Use a slicer set up for belt printing; print start doesn''t draw a purge line. BED_EJECT pushes a finished print
    off the belt.']
sources:
