schema: printer/1
id: creality-ender3-s1-pro
name: Creality Ender 3 S1 Pro
manufacturer: Creality
status: reviewed
docs:
  - {title: "Klipper: Ender 3 S1 / S1 Pro reference config", url: "https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-ender3-s1-2021.cfg"}
  - {title: "Klipper: configuration checks (first power-on)", url: "https://www.klipper3d.org/Config_checks.html"}
kinematics: cartesian
z_leveling: null                 # two Z leadscrews on one driver; no automatic tilt correction
bed_heater: dc
display: unsupported             # the stock display does not run under Klipper

sizes:
  - id: stock
    bed_mm: [235, 235]
    position_max: {x: 235, y: 238, z: 270}
    bed_screws: [[20, 29], [195, 29], [195, 198], [20, 198]]

steppers:
  - {klipper: stepper_x, role: X, rotation_distance: 40}
  - {klipper: stepper_y, role: Y, rotation_distance: 40}
  - {klipper: stepper_z, role: Z0, rotation_distance: 8, dir_inverted: true}

variants:
  - id: standard
    name: Stock
    drivers_required: {motion: 3, extruder: 1}

defaults:
  printer:
    max_velocity: 300
    max_accel: 2000
    max_z_velocity: 5
    max_z_accel: 100
  stepper_xy:
    microsteps: 16
    full_steps_per_rotation: 200
    homing_speed: 50
    homing_retract_dist: 5
    homing_positive_dir: false
    endstop_at_max: false
    run_current: 0.58
  axes:
    x: {position_endstop: -10, position_min: -15}
    y: {position_endstop: -8, position_min: -13}
  stepper_z:
    microsteps: 16
    position_endstop: 0
    position_min: -4
    homing_speed: 5               # Klipper defaults (the reference config sets none)
    second_homing_speed: 2.5
    homing_retract_dist: 5
    run_current: 0.58
  tmc:
    interpolate: false
    stealthchop_threshold: 0
  extruder:
    run_current: 0.5
  bed:
    max_power: 1.0
    max_temp: 110                 # Klipper: "Set to 110 for S1 Pro"
    pid: {pid_kp: 71.867, pid_ki: 1.536, pid_kd: 840.843}
  safe_z_home:
    home_xy_position: user
    speed: 75
    z_hop: 10
  idle_timeout: 1800

stock:
  mainboards: [creality-v24s1-301]
  toolhead: null
  extruder: creality-sprite
  hotend: creality-sprite-s1-pro
  thermistors: {hotend: epcos-b57560, bed: epcos-b57560}
  probe: bltouch
  probe_options: [bltouch]
  probe_offsets: {bltouch: {x: -31.8, y: -40.5}}
  homing_z: probe_virtual_endstop
  fans: [part_cooling, hotend]
  filament_sensors: [{port: FIL}]

notes:
- "Comes with a CR Touch probe, which also finds the Z zero point."
- "The stock motor drivers can't be adjusted from Klipper, so the motor current settings and sensorless homing don't apply unless you fit a different board."
tech_notes:
- "Ships with a CR Touch that homes Z; the Z-STOP input is unused on a stock S1."
- "Stock drivers are standalone: run_current, stealthChop and sensorless homing do not apply until the board is replaced."
unverified:
  - "run_current values are only used with a replacement board with UART drivers; they are not from a source."
sources:
  - repo: https://github.com/Klipper3d/klipper
    path: config/printer-creality-ender3-s1-2021.cfg
    commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
