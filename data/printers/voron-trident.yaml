schema: printer/1
id: voron-trident
name: Voron Trident
manufacturer: Voron Design
status: reviewed
docs:
  - {title: "Voron Trident documentation", url: "https://docs.vorondesign.com/build/"}
  - {title: "Voron initial startup checks", url: "https://docs.vorondesign.com/build/startup/"}
kinematics: corexy
z_leveling: z_tilt

sizes:
  - id: "250"
    bed_mm: [250, 250]
    position_max: {x: 250, y: 250, z: 250}
    z_tilt:
      z_positions: [[-66, 11], [125, 302], [316, 11]]
      points: [[30, 5], [125, 195], [220, 5]]
  - id: "300"
    bed_mm: [300, 300]
    position_max: {x: 300, y: 300, z: 250}
    z_tilt:
      z_positions: [[-66, 11], [150, 352], [366, 11]]
      points: [[30, 5], [150, 245], [270, 5]]
  - id: "350"
    bed_mm: [350, 350]
    position_max: {x: 350, y: 350, z: 250}
    z_tilt:
      z_positions: [[-66, 11], [175, 402], [416, 11]]
      points: [[30, 5], [175, 295], [320, 5]]

steppers:
  - {klipper: stepper_x,  role: B,  position: rear-left,  rotation_distance: 40, dir_inverted: true}
  - {klipper: stepper_y,  role: A,  position: rear-right, rotation_distance: 40, dir_inverted: true}
  - {klipper: stepper_z,  role: Z0, position: front-left,  leadscrew: true, dir_inverted: false}
  - {klipper: stepper_z1, role: Z1, position: rear-center, leadscrew: true, dir_inverted: false}
  - {klipper: stepper_z2, role: Z2, position: front-right, leadscrew: true, dir_inverted: false}

# Trident Z motors have integrated leadscrews; rotation_distance = lead.
leadscrew_options:
  - {id: tr8x8, rotation_distance: 8, default: true}
  - {id: tr8x4, rotation_distance: 4}
  - {id: tr8x2, rotation_distance: 2}

variants:
  - id: standard
    name: Standard (2 A/B motors)
    drivers_required: {motion: 5, extruder: 1}
  - id: awd
    name: AWD (4 A/B motors)
    drivers_required: {motion: 7, extruder: 1}
    extra_steppers:
      - {klipper: stepper_x1, role: B1, position: front-left,  rotation_distance: 40, pairs_with: stepper_x}
      - {klipper: stepper_y1, role: A1, position: front-right, rotation_distance: 40, pairs_with: stepper_y}
    notes:
      - "stepper_x1/stepper_y1 carry no endstop; they share homing with their pair."
      - "Each paired motor must turn the same way as its partner. Check one pair at a time with
        STEPPER_BUZZ and the belts loose before the first home."

defaults:
  printer:
    max_velocity: 300
    max_accel: 3000
    max_z_velocity: 15
    max_z_accel: 350
    square_corner_velocity: 5.0
  stepper_xy:
    microsteps: 32
    full_steps_per_rotation: 200
    homing_speed: 25
    homing_retract_dist: 5
    homing_positive_dir: true
    position_min: 0
    endstop_at_max: true
    run_current: 0.8
  stepper_z:
    microsteps: 32
    position_endstop: -0.5
    position_min: -2.5
    homing_speed: 8          # Voron: leadscrews are slower than 2.4, 10 max
    second_homing_speed: 3
    homing_retract_dist: 3
    run_current: 0.6
  tmc:
    interpolate: false
    stealthchop_threshold: 0
  extruder:
    run_current: 0.5
  safe_z_home:
    home_xy_position: user
    speed: 100
    z_hop: 10
  z_tilt:
    speed: 200
    horizontal_move_z: 10
    retries: 5
    retry_tolerance: 0.0075
  idle_timeout: 1800

stock:
  toolhead: stealthburner
  extruder: clockwork2
  probe_options: [omron-tl-q5mc2, voron-tap, klicky]
  z_endstop: nozzle-switch

sources:
  - repo: https://github.com/VoronDesign/Voron-Trident
    path: Firmware/Octopus/Trident_Octopus_Config.cfg
    commit: f04f747d4dea06315806f352abf57f767cedf2b4
