schema: toolboard/1
id: mellow-fly-sht36-pro
name: Mellow Fly-SHT36 Pro (TMC5160)
manufacturer: Mellow
revisions:
- '1.0'
status: needs-review
mcu:
  chip: rp2040
  bootloader_kib: 16
  bootloader_note: CanBoot preinstalled (Mellow)
  startup_pins: '!gpio13'
  startup_pins_note: Mellow's firmware settings
interfaces:
- can
- usb
can_pins: gpio4/gpio5
form_factor: nema14-back
extruder_driver:
  chip: tmc5160
  interface: spi
  step_pin: gpio23
  dir_pin: gpio24
  enable_pin: '!gpio25'
  spi_cs_pin: gpio20
  spi_software:
    sclk_pin: gpio10
    mosi_pin: gpio11
    miso_pin: gpio12
  sense_resistor: 0.075
heaters:
- id: HEAT
  pin: gpio8
  role: hotend
thermistors:
- id: TEMP
  pin: gpio26
  pullup_ohms: 4700
  typical_use: hotend
- id: BOARD_NTC
  pin: gpio27
  typical_use: board
fans:
- id: FAN0
  pin: gpio15
  wires: 2
- id: FAN1
  pin: gpio14
  wires: 2
probe_ports:
- id: PROBE
  pin: gpio3
  supply_v:
  - 5
  note: 'Probe/Servo connector: GPIO3, GND, GPIO7 (servo), 5V, GND.'
- id: ENDSTOP
  pin: gpio21
  protected: true
  supply_v:
  - 5
  - 12
  note: Endstop connector 5V, GND, 12V, GPIO21, GPIO2; GPIO21 is a high-voltage input with the jumper off (NONE),
    3.3V input with it on (CONN).
bltouch:
  sensor_pin: gpio3
  control_pin: gpio7
endstops:
- id: ENDSTOP
  pin: gpio2
neopixel_ports:
- id: RGB
  pin: gpio6
i2c_ports: []
accelerometer:
  chip: adxl345
  cs_pin: gpio9
  spi_software:
    sclk_pin: gpio10
    mosi_pin: gpio11
    miso_pin: gpio12
notes:
- 'Pins: Mellow pin diagram and sample config agree. The ADXL345 shares the TMC5160 software SPI (gpio10/11/12).
  MAX31865 CS gpio1, AS5047D CS gpio17.'
- Thermistor pull-up 4.7 kΩ; a jumper selects 1.1 kΩ for PT1000. Fan voltage VCC / 12V / 5V by jumper.
- 'Firmware (Mellow): RP2040, 16KiB bootloader, CAN on gpio4/gpio5 at 1M, startup pin !gpio13.'
- Mellow's diagram also shows a TMC2209 build of this board (step gpio24, dir gpio23, en gpio25, UART gpio1, TX
  gpio0, MAX31865 CS gpio13); it is modelled as mellow-fly-sht36-pro-2209.
unverified:
- probe pin polarity
