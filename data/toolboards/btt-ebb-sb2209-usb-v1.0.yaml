schema: toolboard/1
id: btt-ebb-sb2209-usb-v1.0
name: BIGTREETECH EBB SB2209 USB (RP2040)
manufacturer: BIGTREETECH
revisions:
- '1.0'
status: reviewed
mcu:
  chip: rp2040
interfaces:
- usb
form_factor: stealthburner
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: gpio18
  dir_pin: gpio19
  enable_pin: '!gpio17'
  uart_pin: gpio20
  sense_resistor: 0.11
heaters:
- id: HE0
  pin: gpio7
  role: hotend
thermistors:
- id: T0
  pin: gpio26
  pullup_ohms: 4700
  typical_use: hotend
- id: BOARD_NTC
  pin: gpio27
  typical_use: board
fans:
- id: FAN0
  pin: gpio14
  wires: 2
- id: FAN1
  pin: gpio4
  wires: 2
- id: FAN2
  pin: gpio5
  wires: 2
- id: FAN3
  pin: gpio16
  tachometer_pin: gpio12
  wires: 4
probe_ports:
- id: PROBE
  pin: gpio6
i2c_ports:
- id: I2C
  scl_pin: gpio29
  sda_pin: gpio28
  bus: i2c0h
  supply_v:
  - 5
  note: 4-pin I2C header (5V, GND, SCL gpio29, SDA gpio28).
bltouch:
  sensor_pin: gpio21
  control_pin: gpio22
neopixel_ports:
- id: RGB
  pin: gpio15
accelerometer:
  chip: lis2dw
  cs_pin: gpio1
  spi_bus: spi0a
notes:
- 'I2C header: SCL gpio29, SDA gpio28, Klipper hardware bus i2c0h (BTT pin diagram; the sample config''s
  commented I2C lines use i2c0h / gpio29 / gpio28; Klipper src/rp2040/i2c.c maps i2c0h to sda 28, scl
  29).'
- USB only - no CAN transceiver.
unverified:
- connector labels (taken from sample config order)
