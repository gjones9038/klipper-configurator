schema: toolboard/1
id: btt-ebb42-can-v1.2
name: BIGTREETECH EBB42 CAN
manufacturer: BIGTREETECH
revisions:
- '1.2'
status: reviewed
mcu:
  chip: stm32g0b1
  crystal_mhz: 8
  bootloader_kib: 0
interfaces:
- can
- usb
can_pins: PB0/PB1
form_factor: nema17-back
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: PD0
  dir_pin: PD1
  enable_pin: '!PD2'
  uart_pin: PA15
  sense_resistor: 0.11
heaters:
- id: HE0
  pin: PB13
  role: hotend
thermistors:
- id: T0
  pin: PA3
  pullup_ohms: 4700
  typical_use: hotend
fans:
- id: FAN0
  pin: PA0
  wires: 2
- id: FAN1
  pin: PA1
  wires: 2
probe_ports:
- id: ENDSTOP
  pin: PB6
  supply_v:
  - 5
  note: 5-pin Endstop connector (+5V, GND, PB6, PB5, PB7); Tap / switch signal on PB6. 5 V only.
i2c_ports:
- id: I2C
  scl_pin: PB3
  sda_pin: PB4
  bus: i2c3_PB3_PB4
  supply_v:
  - 5
  note: 4-pin I2C header (+5V, GND, PB3, PB4). The same pins are the filament sensor inputs in the sample
    config (FIL0 PB4).
bltouch:
  sensor_pin: PB8
  control_pin: PB9
neopixel_ports:
- id: RGB
  pin: PD3
filament_sensor_ports:
- id: FIL0
  pin: PB4
accelerometer:
  chip: adxl345
  cs_pin: PB12
  spi_bus: spi2_PB2_PB11_PB10
notes:
- 'I2C header: SCL PB3, SDA PB4, Klipper hardware bus i2c3_PB3_PB4 (BTT pin diagram; BTT Eddy manual 4.6/4.7
  wires the Eddy Coil to it as 5V, GND, SCL PB3, SDA PB4; Klipper stm32f0_i2c.c lists I2C3 on PB3/PB4
  as scl, sda).'
- 'Tap / probe input: PB6 on the Endstop connector (BTT pin diagram; klipper-toolchanger and StealthChanger
  examples wire the Tap to PB6 on EBB boards). The connector supplies 5 V only, so 12-24 V inductive probes
  cannot be powered from it.'
- Shares the EBB36 v1.2 pin map.
unverified:
- connector labels (taken from sample config order)
