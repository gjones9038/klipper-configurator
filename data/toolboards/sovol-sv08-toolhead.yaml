schema: toolboard/1
id: sovol-sv08-toolhead
name: Sovol SV08 toolhead board
manufacturer: Sovol
revisions:
- stock
status: needs-review
mcu:
  chip: stm32f103
  bootloader_note: not stated by Sovol
interfaces:
- usb
form_factor: sovol-sv08
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: PA8
  dir_pin: PB8
  enable_pin: '!PB11'
  uart_pin: PB10
  uart_address: 3
  sense_resistor: 0.15
heaters:
- id: HEATER
  pin: PB9
  role: hotend
thermistors:
- id: TH
  pin: PA5
  pullup_ohms: 11500
  typical_use: hotend
fans:
- id: PART-FANS
  pins: [PA7, PB1]
  typical_use: part_cooling
  wires: 2
  note: back (FAN2, PA7) and front (FAN4/LED1, PB1) part fans; Sovol drives them as two fan_generic
- id: FAN1
  pin: PA6
  tachometer_pin: PA1
  tachometer_ppr: 1
  typical_use: hotend
  wires: 3
- id: FAN3
  pin: PB0
  tachometer_pin: PA3
  wires: 3
probe_ports:
- id: PROBE
  pin: PB6
  modifier: ''
  supply_v: [24]
i2c_ports: []
accelerometer:
  chip: adxl345
  cs_pin: PB12
  spi_bus: spi2
notes:
- The two part fans are driven together through [multi_pin] (Sovol's config drives them separately).
- 'Sovol''s [adxl345] gives only cs_pin: PB12; Klipper then uses the MCU''s first SPI bus, spi2 on the STM32F103, so spi2 is written out.'
unverified:
- Only Sovol's sources (config and pin sheet); Klipper has no SV08 config.
- The toolhead MCU's bootloader offset is not stated by Sovol.
- The probe header's supply (24 V) is from the pin sheet's BL-TOUCH connector (GND 24V PB7 GND PB6).
sources:
- {repo: https://github.com/Sovol3d/SV08, path: home/sovol/printer_data/config/printer.cfg, commit: a60644875f8c756d20b3828c9416518b414b5491}
- {repo: https://github.com/Sovol3d/SV08, path: Motherboard/Extra_PIN_definition.pdf, commit: a60644875f8c756d20b3828c9416518b414b5491}
- {repo: https://github.com/Sovol3d/SV08, path: Motherboard/Extra_MCU.pdf, commit: a60644875f8c756d20b3828c9416518b414b5491, note: "STM32F103CBT6"}
