schema: toolboard/1
id: btt-ebb-sb2209-can-v1.0
name: BIGTREETECH EBB SB2209 CAN (STM32)
manufacturer: BIGTREETECH
revisions:
- '1.0'
status: reviewed
mcu:
  chip: stm32g0b1
  crystal_mhz: 8
  bootloader_kib: 0
interfaces:
- can
- usb
can_pins: PB0/PB1
form_factor: stealthburner
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: PD0
  dir_pin: PD1
  enable_pin: '!PD2'
  uart_pin: PA15
  sense_resistor: 0.11
heaters:
- id: HE0
  pin: PB13
  role: hotend
thermistors:
- id: T0
  pin: PA3
  pullup_ohms: 4700
  typical_use: hotend
- id: BOARD_NTC
  pin: PA2
  typical_use: board
fans:
- id: FAN0
  pin: PA1
  wires: 2
- id: FAN1
  pin: PA0
  wires: 2
- id: FAN2
  pin: PB14
  tachometer_pin: PB15
  wires: 4
probe_ports:
- id: PROBE
  pin: PC13
i2c_ports: []   # no I2C header on this board (see notes)
bltouch:
  sensor_pin: PB8
  control_pin: PB9
neopixel_ports:
- id: RGB
  pin: PD3
accelerometer:
  chip: adxl345
  cs_pin: PB12
  spi_bus: spi2_PB2_PB11_PB10
notes:
- No I2C header (BTT pin diagram), so an Eddy Coil cannot be connected; use the Eddy USB instead.
- Mounts on the Stealthburner; has a probe input for Tap/inductive (PC13).
unverified:
- connector labels (taken from sample config order)
sources:
