schema: toolboard/1
id: btt-ebb-sb2209-can-v1.0
name: BIGTREETECH EBB SB2209 CAN (STM32)
manufacturer: BIGTREETECH
revisions:
- '1.0'
status: reviewed
mcu:
  chip: stm32g0b1
  crystal_mhz: 8
  bootloader_kib: 0
interfaces:
- can
- usb
can_pins: PB0/PB1
form_factor: stealthburner
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: PD0
  dir_pin: PD1
  enable_pin: '!PD2'
  uart_pin: PA15
  sense_resistor: 0.11
heaters:
- id: HE0
  pin: PB13
  role: hotend
thermistors:
- id: T0
  pin: PA3
  pullup_ohms: 4700
  typical_use: hotend
- id: BOARD_NTC
  pin: PA2
  typical_use: board
fans:
- id: FAN1
  pin: PA0
  wires: 2
- id: FAN2
  pin: PA1
  wires: 2
- id: 4WFAN
  pin: PB14
  tachometer_pin: PB15
  wires: 4
probe_ports:
- id: ENDSTOP-STOP2
  pin: PB5
  supply_v: [5]
  note: "4-pin Endstop header (+5V, GND, Stop2 PB5, Stop3 PB7). 5 V: use this one for Voron Tap."
- id: PROXIMITY
  pin: PC13
  supply_v: [5, 12, 24]
  note: "3-pin Proximity header (PS PC13, GND, VDD) for inductive probes. VDD is set by the V_Proximity jumper (5V / 12V / VIN), and the NPN jumper must match the probe."
i2c_ports: []   # no I2C header on this board (see notes)
bltouch:
  sensor_pin: PB8
  control_pin: PB9
neopixel_ports:
- id: RGB
  pin: PD3
accelerometer:
  chip: adxl345
  cs_pin: PB12
  spi_bus: spi2_PB2_PB11_PB10
notes:
- No I2C header (BTT pin diagram), so an Eddy Coil cannot be connected; use the Eddy USB instead.
- Mounts on the Stealthburner; has a probe input for Tap/inductive (PC13).
unverified:
sources:
- repo: https://github.com/bigtreetech/EBB
  path: EBB SB2240_2209 CAN/sample-bigtreetech-ebb-sb-canbus-v1.0.cfg
  commit: 2b839d629b174dc1da4f470cd703e5b5fcb43cbe
- repo: https://github.com/bigtreetech/EBB
  path: EBB SB2240_2209 CAN/SB2209/Hardware/SB2209.png
  commit: 2b839d629b174dc1da4f470cd703e5b5fcb43cbe
- repo: https://github.com/Klipper3d/klipper
  path: config/sample-bigtreetech-ebb-sb-canbus-v1.0.cfg
  commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
  note: "matches: extruder PD0/!PD1/!PD2, TMC2209 uart PA15, heater PB13, TH0 PA3, board NTC PA2, fan PA0, hotend fan PA1, ADXL345 PB12 on spi2_PB2_PB11_PB10, BLTouch PB8/PB9"
