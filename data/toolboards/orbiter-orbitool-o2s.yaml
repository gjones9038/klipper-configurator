  path: Orbiter O2S Toolboard/Kipper Config/Orbitool_O2S.cfg
  commit: 52a5a330e1c57ea71ecdc2192382872b0b254452
- repo: https://github.com/RobertLorincz/Orbiter-Toolboards
  path: Orbiter O2S Toolboard/Documentations/Orbitool O2S Block&Pinout.pdf
  commit: 52a5a330e1c57ea71ecdc2192382872b0b254452
- repo: https://github.com/RobertLorincz/Orbiter-Toolboards
  path: Orbiter O2S Toolboard/Documentations/Orbitool O2S User Manual.pdf
  commit: 52a5a330e1c57ea71ecdc2192382872b0b254452
  note: fan voltage jumper, DFU flashing
