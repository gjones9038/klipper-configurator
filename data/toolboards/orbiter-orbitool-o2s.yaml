schema: toolboard/1
id: orbiter-orbitool-o2s
name: Orbitool
manufacturer: Orbiter (Lorincz Electronics); sold by LDO
revisions:
- O2S
status: needs-review
mcu:
  chip: stm32f072
  crystal_mhz: 8
  menuconfig_extra: ['USB serial number: Orbitool_O2S (matches the serial path in toolhead.cfg)', 'Flash over DFU: make flash FLASH_DEVICE=0483:df11 (Orbitool O2S manual)']
usb_path: /dev/serial/by-id/usb-Klipper_stm32f072xb_Orbitool_O2S-if00
interfaces:
- usb
form_factor: orbiter
for_extruders: [orbiter2]
extruder_driver:
  chip: tmc2240
  interface: uart
  step_pin: PB3
  dir_pin: PB4
  enable_pin: '!PC14'
  uart_pin: PC13
  rref_ohms: 12000
heaters:
- id: HOTEND
  pin: PB9
  role: hotend
thermistors:
- id: H1-TEMP
  pin: PA1
  pullup_ohms: 2200
  typical_use: hotend
fans:
- id: PART-FAN
  pin: '!PA10'
  enable_pin: PB14
  tachometer_pin: PA14
  typical_use: part_cooling
  wires: 3
  voltage_options: [12, 24]
  voltage_select: part fan voltage jumper (open 24 V, closed 12 V)
  klipper: {cycle_time: 0.0001, hardware_pwm: false}
  note: 2/3-wire fans. A 4-wire fan uses PWM on PB0 instead (vendor config, commented section; cycle_time 0.00004).
- id: HOT-FAN
  pin: '!PB15'
  tachometer_pin: PB12
  typical_use: hotend
  wires: 3
  klipper: {cycle_time: 0.0001, hardware_pwm: false}   # DC-DC fan driver, 10 kHz (vendor config)
probe_ports: []
i2c_ports:
- id: I2C
  scl_pin: PB6
  sda_pin: PB7
  bus: i2c1_PB6_PB7
  supply_v: [3.3]
neopixel_ports:
- id: RGB
  pin: PC15
filament_sensor_ports:
- id: FIL-SENZ
  pin: PA8
  note: Orbiter v2 sensor; FIL_UNLOAD on PA9
accelerometer:
  chip: adxl345
  cs_pin: PA4
  spi_bus: spi1
misc:
  hotend_power_adc: PA0
  run_led: PB13
  x_stop: PA2
notes:
- Made for the Orbiter 2.0 / 2.5 extruder.
- Set the part fan voltage jumper before connecting the fan (open 24 V, closed 12 V); a 12 V fan on 24 V can be damaged (manual).
- No BLTouch header on the O2S (pinout); use the I2C header or X-STOP.
- 'The accelerometer axes_map depends on mounting (vendor config: "y, z, x" for back-facing vertical mounting).'
unverified:
- Only the designer's sources (config and pinout, which agree on every pin); Klipper has no config for this board.
- The I2C header's 3.3 V supply is from the pinout; whether an Eddy-type probe runs from it is not stated.
discrepancies:
- 'Part fan: the pinout labels PB0 "PWM" and PA10 "Power"; the vendor config drives !PA10 (with enable PB14) for 2/3-wire fans and PB0 only for 4-wire fans. Using the 2/3-wire setup.'
sources:
