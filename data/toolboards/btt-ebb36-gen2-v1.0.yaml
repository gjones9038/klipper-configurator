schema: toolboard/1
id: btt-ebb36-gen2-v1.0
name: BIGTREETECH EBB36 Gen2
manufacturer: BIGTREETECH
revisions:
- '1.0'
status: reviewed
mcu:
  chip: stm32g0b1
  crystal_mhz: 8
  bootloader_kib: 0
interfaces:
- can
- usb
can_pins: PB12/PB13
form_factor: nema14-back
extruder_driver:
  chip: tmc2209
  interface: uart
  step_pin: PB14
  dir_pin: PA8
  enable_pin: '!PB6'
  uart_pin: PB3
  sense_resistor: 0.11
heaters:
- id: HE0
  pin: PB4
  role: hotend
thermistors:
- id: T0
  pin: PA3
  pullup_ohms: 2200
  typical_use: hotend
- id: BOARD_NTC
  pin: PA0
  typical_use: board
fans:
- id: FAN0
  pin: PD3
  wires: 2
- id: FAN1
  pin: PA5
  wires: 2
- id: FAN2
  pin: PD2
  tachometer_pin: PA4
  wires: 4
probe_ports:
- id: PROBE
  pin: PB8
  supply_v:
  - 5
  - 24
  note: PROBE connector (GND, VPROBE, SERVOS PB5, GND, PROBE PB8); VPROBE is 5 V or VIN by jumper. Shared
    with the BLTouch sensor input.
i2c_ports:
- id: I2C
  scl_pin: PA7
  sda_pin: PA6
  bus: i2c3_PA7_PA6
  supply_v:
  - 5
  note: 4-pin I2C header (5V, GND, SCL PA7, SDA PA6).
bltouch:
  sensor_pin: PB8
  control_pin: PB5
neopixel_ports:
- id: RGB
  pin: PC7
filament_sensor_ports:
- id: FIL0
  pin: PD0
accelerometer:
  chip: lis2dw
  cs_pin: PB1
  spi_bus: spi2_PB2_PB11_PB10
notes:
- 'I2C header: SCL PA7, SDA PA6, Klipper hardware bus i2c3_PA7_PA6 (BTT pin diagram; the sample config''s
  commented BME280 block uses the same pins and bus; Klipper stm32f0_i2c.c).'
- 'Probe input: PROBE PB8 on the PROBE connector, whose supply (VPROBE) is jumper-selected 5 V or VIN
  (BTT pin diagram). The sample config uses the same pin as the BLTouch sensor_pin. BTT notes the SERVOS
  pin has no protection circuit.'
- 'Sample config uses pullup_resistor: 2200 for the hotend thermistor.'
unverified:
- connector labels (taken from sample config order)
sources:
