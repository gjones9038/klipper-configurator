schema: extruders/1

# rotation_distance/gear_ratio are starting values: users still calibrate
# (rotation_distance_new = old * actual_mm / requested_mm).
# `pa_baseline` is a starting point for SET_PRESSURE_ADVANCE before the
# tuning tower; it's per extruder because drive type and gearing dominate it.

extruders:
  - id: clockwork2
    name: Voron Clockwork 2 (Stealthburner)
    drive: direct
    rotation_distance: 22.6789511
    gear_ratio: "50:10"
    microsteps: 32
    full_steps_per_rotation: 200
    recommended_motor: ldo-36sth20-1004ahg
    run_current: 0.5
    docs:
      - {title: "Voron: extruder calibration (rotation_distance)", url: "https://docs.vorondesign.com/build/startup/#extruder-calibration-e-steps"}
    pa_baseline: {start: 0.04, range: [0.02, 0.06]}
    confidence: high
    sources:
      - repo: https://github.com/VoronDesign/Voron-2
        path: firmware/klipper_configurations/Octopus/Voron2_Octopus_Config.cfg
        commit: a192410e27ea345644ae5c4b29b4c9c40cbe1a73

  - id: creality-mk8-bowden
    name: Creality stock MK8 extruder (Bowden; Ender 3 / 3 Pro / 3 V2)
    drive: bowden
    rotation_distance: 34.406
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.5, range: [0.2, 1.0]}
    confidence: medium
    sources:
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-creality-ender3-v2-2020.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-creality-ender3pro-2020.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    unverified: ["pa_baseline is the generic Bowden starting range (as for the Voron M4), not measured on this extruder"]

  - id: creality-sprite
    name: Creality Sprite (Ender 3 S1 / S1 Pro, direct drive)
    drive: direct
    rotation_distance: 26.359
    gear_ratio: "42:12"
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.04, range: [0.02, 0.08]}
    confidence: medium
    sources:
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-creality-ender3-s1-2021.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    unverified: ["pa_baseline is the generic direct-drive starting range, not measured on this extruder"]

  - id: creality-ender5pro-bowden
    name: Creality metal Bowden extruder (Ender 5 Pro)
    drive: bowden
    rotation_distance: 32.342
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.5, range: [0.2, 1.0]}
    confidence: medium
    sources:
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-creality-ender5pro-2020.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    unverified: ["pa_baseline is the generic Bowden starting range, not measured on this extruder"]

  - id: sovol-sv06
    name: Sovol SV06 stock extruder (direct drive)
    drive: direct
    rotation_distance: 4.56
    microsteps: 16
    full_steps_per_rotation: 200
    run_current: 0.55
    dir_inverted: true            # Klipper: dir_pin !PB3
    pa_baseline: {start: 0.04, range: [0.02, 0.08]}
    confidence: medium
    sources:
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-sovol-sv06-2022.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b, note: "rotation_distance 4.56, run_current 0.550"}
      - {repo: https://github.com/Sovol3d/Sv06-Source-Code, path: Marlin/Configuration.h, commit: ba1b9e11815d3202d5fd7871e35c18f7416b4ab1, note: "E steps 691.5/mm at 16 microsteps (rotation_distance 4.627); E0_CURRENT 550"}
    discrepancies: ["rotation_distance: Klipper 4.56, Marlin 691.5 steps/mm (4.627). Using Klipper's; calibrate it (TUNE_E_STEPS)."]
    unverified: ["pa_baseline is the generic direct-drive starting range"]

  - id: voron-mini-afterburner
    name: Voron V0 Mini Afterburner extruder
    drive: direct
    rotation_distance: 22.23
    gear_ratio: "50:10"
    microsteps: 32
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.04, range: [0.02, 0.06]}
    confidence: high
    sources:
      - {repo: https://github.com/VoronDesign/Voron-0, path: Firmware/bigtreetech-skr-mini-e3-v3.0.cfg, commit: a53fc87562fd630c846af38d7de850c894dc3d85,
         note: "rotation_distance 22.23, gear_ratio 50:10 # For Mini Afterburner, microsteps 32"}
    unverified: ["pa_baseline is the Clockwork starting range"]

  - id: sovol-sv08
    name: Sovol SV08 stock extruder (direct drive)
    drive: direct
    rotation_distance: 6.5
    microsteps: 16
    full_steps_per_rotation: 200
    run_current: 0.8
    pa_baseline: {start: 0.025, range: [0.01, 0.05]}
    confidence: medium
    sources:
      - {repo: https://github.com/Sovol3d/SV08, path: home/sovol/printer_data/config/printer.cfg, commit: a60644875f8c756d20b3828c9416518b414b5491, note: "rotation_distance 6.5, run_current 0.8, pressure_advance 0.025"}

  - id: sovol-sv08-max
    name: Sovol SV08 Max stock extruder (direct drive)
    drive: direct
    rotation_distance: 6.5
    microsteps: 16
    full_steps_per_rotation: 200
    run_current: 0.8
    pa_baseline: {start: 0.025, range: [0.01, 0.05]}
    confidence: medium
    sources:
      - {repo: https://github.com/Sovol3d/SV08MAX, path: home/sovol/printer_data/config/printer.cfg, commit: 68c28ea4ef5a81279d69c0e7d3b6433f0945192b, note: "rotation_distance 6.5, run_current 0.8, pressure_advance 0.025"}

  - id: prusa-mk3s
    name: Prusa MK3S extruder (Bondtech gears, direct drive)
    drive: direct
    rotation_distance: 22.857
    microsteps: 16
    full_steps_per_rotation: 200
    run_current: 0.52
    pa_baseline: {start: 0.04, range: [0.02, 0.08]}
    confidence: high
    sources:
      - {repo: https://github.com/Rat-OS/RatOS-configuration, path: extruders/mk3s.cfg, commit: 3a6a8b018fd46ef4343a246a66b8c0fc357f05a4, note: "rotation_distance 22.857; pressure_advance 0.04 reference in the MK3S template"}
      - {repo: https://github.com/prusa3d/Prusa-Firmware, path: Firmware/variants/MK3S.h, commit: f3e0dfd481a78b222d2a82752f261adbc5a2c4d7, note: "E 280 steps/mm (at 32 microsteps: 200 * 32 / 280 = 22.857)"}

  - id: elegoo-neptune3pro
    name: Elegoo Neptune 3 Pro stock extruder (dual-gear direct drive)
    drive: direct
    rotation_distance: 8.42
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.04, range: [0.02, 0.08]}
    confidence: medium
    sources:
      - {repo: https://github.com/Klipper3d/klipper, path: config/printer-elegoo-neptune3-pro-2023.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
    unverified: ["pa_baseline is the generic direct-drive starting range"]

  - id: clockwork1
    name: Voron Clockwork (Afterburner)
    drive: direct
    rotation_distance: 22.6789511
    gear_ratio: "50:17"
    microsteps: 32
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.04, range: [0.02, 0.06]}
    confidence: high
    sources:
      - {repo: https://github.com/VoronDesign/Voron-2, path: firmware/klipper_configurations/Octopus/Voron2_Octopus_Config.cfg,
         note: "comment: 'Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)'"}

  - id: voron-m4
    name: Voron M4 (Bowden)
    drive: bowden
    rotation_distance: 22.6789511
    gear_ratio: "80:20"
    microsteps: 32
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.5, range: [0.2, 1.0]}
    confidence: medium
    sources:
      - {repo: https://github.com/VoronDesign/Voron-2, path: firmware/klipper_configurations/Octopus/Voron2_Octopus_Config.cfg,
         note: "comment: 'Use 80:20 for M4, M3.1'"}

  - id: galileo2
    name: Galileo 2 (G2E Stealthburner / G2SA standalone)
    drive: direct
    rotation_distance: 47.088
    gear_ratio: "9:1"
    microsteps: 16
    full_steps_per_rotation: 200
    run_current: 0.6
    pa_baseline: {start: 0.035, range: [0.02, 0.06]}
    confidence: high
    docs:
      - {title: "Galileo 2 Klipper settings", url: "https://github.com/JaredC01/Galileo2#klipper-settings-for-g2-extruders-g2e-and-g2sa"}
    sources:
      - repo: https://github.com/JaredC01/Galileo2
        path: README.md
        commit: 98f8a37944d7277cd37231776400553cc402219f

  - id: orbiter2
    name: Orbiter 2.0 / 2.5
    drive: direct
    rotation_distance: 4.69
    gear_ratio: null              # gearing is folded into rotation_distance
    microsteps: 32
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.025, range: [0.01, 0.05]}
    confidence: medium
    sources:
      - {repo: https://github.com/RobertLorincz/Orbiter-Toolboards, path: "Orbiter O2 Toolboard/Klipper Config/OrbitoolO2.cfg", commit: 52a5a330e1c57ea71ecdc2192382872b0b254452,
         note: "rotation_distance = 4.69 # Orbiter v2; microsteps 32 (the Orbiter's designer)"}
      - {repo: https://github.com/RobertLorincz/Orbiter-Toolboards, path: "Orbiter O2S Toolboard/Kipper Config/Orbitool_O2S.cfg", commit: 52a5a330e1c57ea71ecdc2192382872b0b254452,
         note: "rotation_distance = 4.69 # Orbiter v2.5"}
    discrepancies: ["The earlier record used 4.637 (690 steps/mm at 16 microsteps, quoted from vendor docs that were not fetched); the designer's configs use 4.69."]
    unverified: ["pa_baseline is not from a source"]

  - id: smart-orbiter3
    name: Smart Orbiter 3 (SO3)
    drive: direct
    rotation_distance: 4.69
    gear_ratio: null
    microsteps: 32
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.025, range: [0.01, 0.05]}
    confidence: medium
    sources:
      - {repo: https://github.com/RobertLorincz/Orbiter-Toolboards, path: "Orbiter SO3 Toolboard/Klipper Config/SO3.cfg", commit: 52a5a330e1c57ea71ecdc2192382872b0b254452}
    unverified: ["pa_baseline is not from a source (the vendor config has its own pressure_advance)"]

  - id: sherpa-mini
    name: Sherpa Mini
    drive: direct
    rotation_distance: 22.6789511
    gear_ratio: "50:10"
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.04, range: [0.02, 0.06]}
    confidence: low
    unverified: ["rotation_distance and gear_ratio (Annex repo has no Klipper values)"]

  - id: lgx-lite
    name: Bondtech LGX Lite
    drive: direct
    rotation_distance: 5.7
    gear_ratio: null
    microsteps: 16
    full_steps_per_rotation: 200
    pa_baseline: {start: 0.03, range: [0.015, 0.05]}
    confidence: low
    unverified: ["rotation_distance (562 steps/mm @16 microsteps per vendor docs, not fetched)"]
    discrepancies: ["RatOS extruders/lgx-lite.cfg uses rotation_distance 5.57 (Rat-OS/RatOS-configuration 3a6a8b018fd46ef4343a246a66b8c0fc357f05a4); 562 steps/mm would be 5.694. Calibrate it (TUNE_E_STEPS)."]

# Z drive options that change Z stepper math (Voron 2.4 only).
z_drives:
  - id: voron-stock-z
    applies_to: [voron-2.4]
    rotation_distance: 40
    gear_ratio: "80:16"
    microsteps: 32
    run_current: 0.8
    sources: [{repo: https://github.com/VoronDesign/Voron-2, path: firmware/klipper_configurations/Octopus/Voron2_Octopus_Config.cfg}]
  - id: galileo2-z
    applies_to: [voron-2.4]
    rotation_distance: 40
    gear_ratio: "9:1"
    microsteps: 32
    run_current: 0.8
    sources: [{repo: https://github.com/JaredC01/Galileo2, path: README.md, commit: 98f8a37944d7277cd37231776400553cc402219f}]

notes:
  - "pa_baseline values are community-typical starting points for PLA/PETG/ABS at around
    0.4 mm nozzles. Low confidence by design: the tuning flow (tuning.yaml) replaces them."
