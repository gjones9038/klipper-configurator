schema: toolheads/1

# Printhead assemblies (the plastic + fans + LEDs on the carriage), as distinct
# from toolhead *boards* (data/toolboards). They set fan roles, LEDs, the
# compatible board form factors and the input shaper baseline.

toolheads:
  - id: stealthburner
    name: Voron Stealthburner
    applies_to: [voron-2.4, voron-trident]
    compatible_extruders: [clockwork2, galileo2]
    toolboard_form_factors: [stealthburner, nema14-back]
    fans:
      - {role: part_cooling, count: 2, size: "4010 blower", voltage: 24, wiring: "both on one port"}
      - {role: hotend, count: 1, size: "3010 axial", voltage: 24}
    leds:
      type: neopixel
      chain_count: 3              # 1 logo + 2 nozzle
      color_order: GRBW
    x_endstop_location: toolhead  # common SB setup; Voron stock places it on the gantry
    input_shaper_baseline:
      x: {type: mzv, freq_hz: 55}
      y: {type: mzv, freq_hz: 40}
      confidence: low
    unverified: ["leds.color_order (varies by LED vendor)", "input_shaper_baseline"]

  - id: stealthchanger-sb
    name: StealthChanger tool (Stealthburner-based)
    applies_to: [voron-2.4, voron-trident]
    multi_tool: true
    compatible_extruders: [clockwork2, galileo2]
    toolboard_form_factors: [stealthburner, nema14-back]
    requires_toolboard: true      # each tool carries its own CAN/USB board
    dock_spacing_mm: 76           # StealthChanger wiki, Docks: space per tool
    fans:
      - {role: part_cooling, count: 2, size: "4010 blower", voltage: 24, wiring: "both on one port"}
      - {role: hotend, count: 1, size: "3010 axial", voltage: 24}
    leds: {type: neopixel, chain_count: 3, color_order: GRBW}
    input_shaper_baseline:
      x: {type: mzv, freq_hz: 50}
      y: {type: mzv, freq_hz: 38}
      confidence: low
    unverified: ["everything in this entry beyond the SB fan layout"]

  - id: stealthchanger-dragonburner
    name: StealthChanger tool (Dragon Burner)
    applies_to: [voron-2.4]
    multi_tool: true
    requires_toolboard: true      # each tool carries its own CAN/USB board
    dock_spacing_mm: 60           # StealthChanger wiki, Docks: space per tool
    input_shaper_baseline: null   # no published figure; measure with TUNE_SHAPER
    notes:
      - "Each tool is a Dragon Burner on a StealthChanger backplate. This tool doesn't know the Dragon Burner's fans or lights, so pick its fans on the Fans step as you wired them."
      - "Some extruders need the Dragon Burner extended extruder mount (StealthChanger bill of materials)."
    sources:
      - {repo: https://github.com/DraftShift/StealthChanger, path: README.md, commit: 50e3c769297b273ac390fb33b455aa7f4dfe3099, note: "supported toolheads: Stealth Burner, Dragon Burner, Rapid Burner, Yavoth, AntHead, A4T, XOL, Jabberwocky, Archetype BlackBird"}
      - {repo: https://github.com/DraftShift/StealthChanger, path: "STLs/Backplates/DragonBurner.stl", commit: 50e3c769297b273ac390fb33b455aa7f4dfe3099}

