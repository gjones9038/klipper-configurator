# Imported from https://github.com/Klipper3d/klipper config/printer-lulzbot-mini1-2016.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: lulzbot-mini1-board
name: LulzBot Mini 1 mainboard
manufacturer: LulzBot
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: atmega2560, arch: avr, cpu_mhz: 16}
interfaces: [usb-serial]
firmware: {interface: 'Serial (UART0), 250000 baud (Klipper''s AVR default)'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PC0
  dir_pin: PL1
  enable_pin: '!PA7'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Y
  step_pin: PC1
  dir_pin: PL0
  enable_pin: '!PA6'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Z
  step_pin: PC2
  dir_pin: PL2
  enable_pin: '!PA5'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: E
  step_pin: PC3
  dir_pin: PL6
  enable_pin: '!PA4'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
endstops:
- {id: X-STOP, pin: PB6, modifier: ^!}
- {id: Y-STOP, pin: PB5, modifier: ^!}
- {id: Z-STOP, pin: PA1, modifier: ^!}
heaters:
- {id: HEATER, pin: PE5, role: hotend}
- {id: BED, pin: PG5, role: bed}
thermistors:
- {id: TH0, pin: PF0, typical_use: hotend}
- {id: TB, pin: PF2, typical_use: bed}
fans:
- {id: FAN0, pin: PH5, typical_use: part_cooling}
- {id: FAN1, pin: PH3, typical_use: hotend}
probe_ports:
- {id: PROBE, pin: PB4, modifier: ^!}
setup_sections:
- section: output_pin stepper_xy_current
  why: sets the motor current
  klipper: {pin: PL3, pwm: 'True', scale: '2.0', cycle_time: '.000030', hardware_pwm: 'True', value: '1.300'}
- section: output_pin stepper_z_current
  why: sets the motor current
  klipper: {pin: PL4, pwm: 'True', scale: '2.0', cycle_time: '.000030', hardware_pwm: 'True', value: '1.630'}
- section: output_pin stepper_e_current
  why: sets the motor current
  klipper: {pin: PL5, pwm: 'True', scale: '2.0', cycle_time: '.000030', hardware_pwm: 'True', value: '1.250'}
- section: static_digital_output stepper_config
  why: sets the motor drivers' microstep pins
  klipper: {pins: 'PG1, PG0, PK7, PG2, PK6, PK5, PK3, PK4'}
- section: static_digital_output yellow_led
  why: fixed board output from Klipper's config
  klipper: {pins: '!PB7'}
notes: ['Klipper sets this board''s motor current with its own current settings (copied from Klipper''s config), not the usual
    driver settings. Sensorless homing (homing without switches) isn''t possible.']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k).]
