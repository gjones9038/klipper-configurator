schema: mainboard/1
id: btt-skr-3
name: BIGTREETECH SKR 3 / SKR 3 EZ
manufacturer: BIGTREETECH
revisions:
- '1.0'
status: reviewed
mcu_variants:
- chip: stm32h743
  crystal_mhz: 25
  bootloader_kib: 128
- chip: stm32h723
  crystal_mhz: 25
  bootloader_kib: 128
interfaces:
- usb
- can
driver_mount: stepstick
supported_drivers:
- tmc2209
- tmc2226
- tmc2208
- tmc2130
- tmc5160
- tmc2240
tmc_spi:
  software:
    mosi_pin: PE13
    miso_pin: PE15
    sclk_pin: PE14
driver_slots:
- id: X
  step_pin: PD4
  dir_pin: PD3
  enable_pin: '!PD6'
  uart_pin: PD5
  spi_cs_pin: PD5
  diag_pin: PC1
- id: Y
  step_pin: PA15
  dir_pin: PA8
  enable_pin: '!PD1'
  uart_pin: PD0
  spi_cs_pin: PD0
  diag_pin: PC3
- id: Z
  step_pin: PE2
  dir_pin: PE3
  enable_pin: '!PE0'
  uart_pin: PE1
  spi_cs_pin: PE1
  diag_pin: PC0
- id: E0
  step_pin: PD15
  dir_pin: PD14
  enable_pin: '!PC7'
  uart_pin: PC6
  spi_cs_pin: PC6
  diag_pin: PC2
- id: E1
  step_pin: PD11
  dir_pin: PD10
  enable_pin: '!PD13'
  uart_pin: PD12
  spi_cs_pin: PD12
  diag_pin: PA0
endstops:
- id: X-STOP
  pin: PC1
  diag_of: X
- id: Y-STOP
  pin: PC3
  diag_of: Y
- id: Z-STOP
  pin: PC0
  diag_of: Z
- id: E0-STOP
  pin: PC2
  diag_of: E0
- id: E1-STOP
  pin: PA0
  diag_of: E1
heaters:
- id: HE0
  pin: PB3
  role: hotend
- id: HE1
  pin: PB4
  role: hotend
- id: HB
  pin: PD7
  role: bed
thermistors:
- id: T0
  pin: PA2
  pullup_ohms: 4700
  alt_pullup_ohms_by_jumper: 1000
- id: T1
  pin: PA3
  pullup_ohms: 4700
  alt_pullup_ohms_by_jumper: 1000
- id: TB
  pin: PA1
  pullup_ohms: 4700
  typical_use: bed
  alt_pullup_ohms_by_jumper: 1000
fans:
- id: FAN0
  pin: PB7
  wires: 2
  voltage_options: &id001
  - 5
  - 12
  - 24
  voltage_select: one selection shared by all 3 PWM fans
- id: FAN1
  pin: PB6
  wires: 2
  voltage_options: *id001
  voltage_select: one selection shared by all 3 PWM fans
- id: FAN2
  pin: PB5
  wires: 2
  voltage_options: *id001
  voltage_select: one selection shared by all 3 PWM fans
exp_aliases:
  EXP1_1: PC5
  EXP1_3: PB1
  EXP1_5: PE9
  EXP1_7: PE11
  EXP1_9: <GND>
  EXP1_2: PB0
  EXP1_4: PE8
  EXP1_6: PE10
  EXP1_8: PE12
  EXP1_10: <5V>
  EXP2_1: PA6
  EXP2_3: PE7
  EXP2_5: PB2
  EXP2_7: PC4
  EXP2_9: <GND>
  EXP2_2: PA5
  EXP2_4: PA4
  EXP2_6: PA7
  EXP2_8: <RST>
  EXP2_10: <NC>
notes:
- 'Only 5 drivers: a Voron 2.4 is not possible; a Trident needs the extruder on a CAN toolhead board.'
- 'SKR 3 EZ takes EZ-format drivers and its PT1000 jumper gives 2.2k (SKR 3: 1k).'
unverified:
- SKR 3 EZ pin identity with SKR 3
sources:
