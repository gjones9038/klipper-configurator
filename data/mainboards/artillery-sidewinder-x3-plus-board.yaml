# Imported from https://github.com/Klipper3d/klipper config/printer-artillery-sidewinder-x3-plus-2024.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: artillery-sidewinder-x3-plus-board
name: Artillery Sidewinder X3 Plus / X3 Pro mainboard
manufacturer: Artillery
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f401, crystal_mhz: 8, bootloader_kib: 48}
interfaces: [usb]
firmware: {interface: USB communication, flash: '- Select the 48KiB bootloader, - Select USB PA11/PA12 for USB communication
    interface. - Select the NO BOOTLOADER - Select USB PA11/PA12 for USB communication interface. - Select USART2 PA3/PA2
    for UART communication via the Wi-Fi Tx/Rx pins - quit, save, make - Connect your printer to a computer running Pronterface,
    Octoprint, Repetier, BedLeveler5000 (anything with Console capability) - Power on the machine and send M997 through console
    into Marlin, this will put the board into "DFU" mode - DO NOT TURN OFF THE PRINTER - Connect your Linux/Klipper device
    to the USB port - Run lsusb and verify that the STM32 DFU device is visible (Bus 001 Device 006: ID 0483:df11 STMicroelectronics
    STM Device in DFU Mode) - Run sudo make flash 0483:df11 - Run lsusb again and there should be two devices: Bus 001 Device
    007: ID 1d50:614e OpenMoko, Inc.'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PA8
  dir_pin: PC9
  enable_pin: '!PA15'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Y
  step_pin: PC7
  dir_pin: PC6
  enable_pin: '!PC8'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Z
  step_pin: PB10
  dir_pin: PA4
  enable_pin: '!PC4'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: E
  step_pin: PC11
  dir_pin: PC10
  enable_pin: '!PC12'
  onboard_driver: {chip: null, standalone: true, microsteps: 64, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
endstops:
- {id: X-STOP, pin: PB9, modifier: '!'}
- {id: Y-STOP, pin: PB8, modifier: '!'}
heaters:
- {id: HEATER, pin: PA6, role: hotend}
- {id: BED, pin: PA7, role: bed}
thermistors:
- {id: TH0, pin: PC5, typical_use: hotend}
- {id: TB, pin: PC0, typical_use: bed}
fans:
- {id: FAN0, pin: PB1, typical_use: hotend}
- {id: FAN1, pin: PB0, typical_use: part_cooling}
probe_ports:
- {id: PROBE, pin: PC14, modifier: ''}
notes: ['The motor drivers on this board can''t be adjusted from Klipper. Motor current is set on the board, and sensorless
    homing (homing without switches) isn''t possible.']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
