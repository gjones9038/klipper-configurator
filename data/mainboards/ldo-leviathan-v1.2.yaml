  spi_bus: spi4
  diag_pin: PG1
  diag_pin_key: diag0_pin
  diag_modifier: ^!
- id: HV-STEPPER-1
  step_pin: PF15
  dir_pin: PF14
  enable_pin: '!PE9'
  onboard_driver:
    chip: tmc5160
    klipper_section: tmc5160
    sense_resistor: 0.075
    max_current_a: 3.0
    motor_power: HV input, 24-55V (48V typical)
