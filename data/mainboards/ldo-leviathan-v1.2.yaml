  spi_bus: spi4
  diag_pin: PE10
  diag_pin_key: diag0_pin
  diag_modifier: ^!
- id: STEPPER-0
  step_pin: PD4
  dir_pin: PD3
  enable_pin: '!PD7'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PD5
  diag_pin: PD6
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-1
  step_pin: PC12
  dir_pin: PC11
  enable_pin: '!PD2'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PD0
  diag_pin: PD1
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-2
  step_pin: PC9
  dir_pin: PC8
  enable_pin: '!PC10'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PA8
  diag_pin: PA15
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-3
  step_pin: PG7
  dir_pin: PG6
  enable_pin: '!PC7'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PG8
  diag_pin: PC6
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-4
  step_pin: PD10
  dir_pin: PD9
