  EXP1_2: PG12
  EXP1_3: PG13
  EXP1_4: PG14
  EXP1_5: PC13
  EXP1_6: PC14
  EXP1_7: PC15
  EXP1_8: PF0
  EXP1_9: <GND>
  EXP1_10: <5V>
  EXP2_1: PA6
  EXP2_2: PA5
  EXP2_3: PE2
  EXP2_4: PE4
  EXP2_5: PE3
  EXP2_6: PA7
  EXP2_7: PE5
  EXP2_8: <RST>
  EXP2_9: <GND>
  EXP2_10: PE4
notes:
- 'Thermistor pull-ups are 2.2k: every thermistor section needs ''pullup_resistor: 2200''.'
- HV-STEPPER-0/1 (TMC5160) are intended for A/B; they need the HV input powered.
discrepancies:
- 'Klipper''s generic-ldo-leviathan-v1.2.cfg has copy errors: stepper_z1 reuses Z''s UART pin (PD5), stepper_z3''s
  TMC section is named stepper_z2, and the extruder TMC section is named stepper_z. Pins here follow LDO''s
  voron2_leviathan.cfg.'
- 'FAN0 tachometer: LDO configs use PB8, Klipper''s generic uses PB0 (which Klipper also lists as EXP3_13).
  Using PB8 (manufacturer).'
- 'Bootloader: Klipper generic says 32KiB bootloader, LDO''s config says ''No bootloader''. Depends on
  how the board was flashed (stock vs Katapult); the generator should ask.'
- LDO README lists an STM32H743, but both v1.2 configs target STM32F446. The README probably describes
  a later revision; confirm before adding one.
