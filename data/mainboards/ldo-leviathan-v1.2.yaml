  - 24
  voltage_select: per-port jumper
- id: FAN1
  pin: PB3
  tachometer_pin: PB4
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
- id: FAN2
  pin: PF7
  tachometer_pin: PF6
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
- id: FAN3
  pin: PF9
  tachometer_pin: PF8
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
