# Imported from Klipper's config/printer-biqu-b1-se-plus-2022.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: biqu-b1-se-plus-board
name: BIQU B1 SE Plus mainboard
manufacturer: BIQU
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f407, crystal_mhz: 8, bootloader_kib: 32}
interfaces: [usb]
firmware: {flash: 'To use this config, the firmware should be compiled for the STM32F407 with a "32KiB bootloader". In newer
    versions of this board shipped in late 2021 the STM32F429 is used, if this is the case compile for this with a "32KiB
    bootloader" You will need to check the chip on your board to identify which you have. The "make flash" command does not
    work on the SKR 2. Instead, after running "make", copy the generated "out/klipper.bin" file to a file named "firmware.bin"
    on an SD card and then restart the SKR 2 with that SD card.'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PE2
  dir_pin: PE1
  enable_pin: '!PE3'
  onboard_driver: {chip: tmc2208, klipper_section: tmc2208}
  uart_pin: PE0
- id: Y
  step_pin: PD5
  dir_pin: PD4
  enable_pin: '!PD6'
  onboard_driver: {chip: tmc2208, klipper_section: tmc2208}
  uart_pin: PD3
- id: Z
  step_pin: PA15
  dir_pin: PA8
  enable_pin: '!PD1'
  onboard_driver: {chip: tmc2208, klipper_section: tmc2208}
  uart_pin: PD0
- id: E
  step_pin: PD15
  dir_pin: PD14
  enable_pin: '!PC7'
  onboard_driver: {chip: tmc2208, klipper_section: tmc2208}
  uart_pin: PC6
endstops:
- {id: X-STOP, pin: PC1, modifier: '!'}
- {id: Y-STOP, pin: PC3, modifier: '!'}
heaters:
- {id: HEATER, pin: PB3, role: hotend}
- {id: BED, pin: PD7, role: bed}
thermistors:
- {id: TH0, pin: PA2, typical_use: hotend}
- {id: TB, pin: PA1, typical_use: bed}
fans:
- {id: FAN0, pin: PB7, typical_use: part_cooling}
- {id: FAN1, pin: PB6}
- {id: FAN2, pin: PB5, typical_use: hotend}
probe_ports:
- {id: PROBE, pin: PE4, modifier: ^!}
notes: []
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
sources:
- {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-biqu-b1-se-plus-2022.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
