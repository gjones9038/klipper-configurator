# Imported from https://github.com/Klipper3d/klipper config/printer-biqu-bx-2021.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: biqu-bx-board
name: BIQU BX mainboard
manufacturer: BIQU
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32h743, crystal_mhz: 8, bootloader_kib: 128}
interfaces: [usb]
firmware: {flash: 'To use this config, the firmware should be compiled for the STM32H743 with a "128KiB bootloader". Instead,
    after running "make", copy the generated "out/klipper.bin" file to a file named "firmware.bin" on an SD card and then
    restart the SKR SE BX with that SD card. After klipper has been flashed once to the board, you can update klipper by leaving
    a microSD inserted and running the scripts/flash-sd.sh script.'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PG13
  dir_pin: PG12
  enable_pin: '!PG14'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PG10
  diag_pin: PB11
  diag_pin_key: diag_pin
  diag_modifier: ^
- id: Y
  step_pin: PB3
  dir_pin: PD3
  enable_pin: '!PB4'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PD4
  diag_pin: PB12
  diag_pin_key: diag_pin
  diag_modifier: ^
- id: Z
  step_pin: PD7
  dir_pin: PD6
  enable_pin: '!PG9'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PD5
- id: Z1
  step_pin: PA8
  dir_pin: PC9
  enable_pin: '!PD2'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PC8
- id: E
  step_pin: PC14
  dir_pin: PC13
  enable_pin: '!PC15'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PI8
endstops: []
heaters:
- {id: HEATER, pin: PC4, role: hotend}
- {id: BED, pin: PA4, role: bed}
thermistors:
- {id: TH0, pin: PH4, typical_use: hotend}
- {id: TB, pin: PH5, typical_use: bed}
fans:
- {id: FAN0, pin: PA5, typical_use: part_cooling}
- {id: FAN1, pin: PA6, typical_use: hotend}
- {id: FAN2, pin: PA7, typical_use: controller}
probe_ports:
- {id: PROBE, pin: PH2, modifier: ''}
setup_sections:
- section: output_pin motor_power
  why: keeps part of the printer powered or enabled (Klipper's config)
  klipper: {pin: PI11, value: '1'}
- section: output_pin screen
  why: keeps part of the printer powered or enabled (Klipper's config)
  klipper: {pin: PB5, value: '1'}
notes: []
tech_notes: ['Not generated (lights, LEDs, beepers): [output_pin beeper], [neopixel led], [neopixel knob].']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
sources:
- {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-biqu-bx-2021.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
