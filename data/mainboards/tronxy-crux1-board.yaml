firmware: {flash: 'Klipper configuration for the TronXY Crux1 printer CXY-V10.1-220921 mainboard, GD32F4XX or STM32F446 MCU  =======================
    BUILD AND FLASH OPTIONS =======================  MCU-architecture:  STMicroelectronics Processor model:   STM32F446 Bootloader
    offset: 64KiB Comms interface:   Serial on USART1 PA10/PA9  Build the firmware with these options Rename the resulting
    klipper.bin into fmw_tronxy.bin Put the file into a directory called "update" on a FAT32 formatted SD card. Turn off the
    printer, plug in the SD card and turn the printer back on Flashing will start automatically and progress will be indicated
    on the LCD Once the flashing is completed the display will get stuck on the white Tronxy logo bootscreen The LCD display
    will NOT work anymore after flashing Klipper onto this printer'}
