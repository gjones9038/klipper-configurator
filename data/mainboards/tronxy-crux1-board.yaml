schema: mainboard/1
id: tronxy-crux1-board
name: Tronxy Crux1 mainboard
manufacturer: Tronxy
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f446, crystal_mhz: 8, bootloader_kib: 0, check_dict: stm32f446-usart1}
interfaces: [usb-serial]
