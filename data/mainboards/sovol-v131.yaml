schema: mainboard/1
id: sovol-v131
name: Sovol
manufacturer: Sovol
revisions:
- V131
status: reviewed
# Stock board of the Sovol SV06 (GD32F103, TMC2209 on single-wire UART).
mcu_variants:
- chip: gd32f103
  build_as: stm32f103
  crystal_mhz: 8
  bootloader_kib: 28
  menuconfig_extra: [Disable SWD at startup]
interfaces:
- usb-serial
usb_serial:
  chip: CH340
  serial_path: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
firmware:
  interface: Serial (on USART1 PA10/PA9)
  flash: >-
    Copy out/klipper.bin to an SD card (rename it to something new ending in .bin; the board
    skips a file name it has already flashed) and power the printer on with the card inserted.
power:
  vin_v: [24, 24]
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PC2
  dir_pin: PB9
  enable_pin: '!PC3'
  onboard_driver: &drv
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.15
  uart_pin: PC1
  uart_address: 3
  diag_pin: PA5
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: Y
  step_pin: PB8
  dir_pin: PB7
  enable_pin: '!PC3'
  onboard_driver: *drv
  uart_pin: PC0
  uart_address: 3
  diag_pin: PA6
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: Z
  step_pin: PB6
  dir_pin: PB5
  enable_pin: '!PC3'
  onboard_driver: *drv
  uart_pin: PA15
  uart_address: 3
  diag_pin: PA7
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: E
  step_pin: PB4
  dir_pin: PB3
  enable_pin: '!PC3'
  onboard_driver: *drv
  uart_pin: PC14
  uart_address: 3
endstops:
- id: X-STOP
  pin: PA5
  diag_of: X
- id: Y-STOP
  pin: PA6
  diag_of: Y
- id: Z-STOP
  pin: PA7
  diag_of: Z
heaters:
- id: HEATER
  pin: PA1
  role: hotend
- id: HOTBED
  pin: PA2
  role: bed
  drive: dc
thermistors:
- id: TH0
  pin: PC5
  typical_use: hotend
- id: TB
  pin: PC4
  typical_use: bed
fans:
- id: FAN
  pin: PA0
  typical_use: part_cooling
probe_ports:
- id: PROBE
  pin: PB1
  modifier: ''
  note: Stock inductive probe input (Klipper sovol-sv06 config uses plain PB1); also the BLTouch sensor input in Marlin.
bltouch:
  sensor_pin: PB1
  control_pin: PB0
filament_sensor_ports:
- id: FIL
  pin: PA4
notes:
- All four drivers share one enable pin (PC3); each has its own UART pin, all at uart_address 3.
- X/Y DIAG lines are the X-STOP/Y-STOP inputs; the stock SV06 homes X and Y sensorless.
- Hotend and board fans are always on; only FAN (part cooling) is switchable.
unverified:
- crystal_mhz 8 is Klipper's default; neither source states it.
- Thermistor pull-ups are not stated; Klipper's default 4.7k is used, as in Klipper's config.
sources:
- repo: https://github.com/Klipper3d/klipper
  path: config/printer-sovol-sv06-2022.cfg
  commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
- repo: https://github.com/Sovol3d/Sv06-Source-Code
  path: Marlin/src/pins/stm32f1/pins_SOVOL_V131.h
  commit: ba1b9e11815d3202d5fd7871e35c18f7416b4ab1
  note: agrees on every pin (incl. UART PC1/PC0/PA15/PC14, BLTouch PB1/PB0, FIL_RUNOUT PA4); RSENSE 0.15 in Configuration_adv.h
