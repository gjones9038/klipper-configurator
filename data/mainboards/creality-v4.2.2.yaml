schema: mainboard/1
id: creality-v4.2.2
name: Creality
manufacturer: Creality
revisions:
- v4.2.2
status: reviewed
# Stock board of the Ender 3 V2 / V2 Neo and the 2020+ Ender 3 Pro. Later batches carry a
# GD32F103 instead of the STM32F103 (Klipper printer-creality-ender3pro-2020.cfg).
mcu_variants:
- chip: stm32f103
  crystal_mhz: 8
  bootloader_kib: 28
- chip: gd32f103
  build_as: stm32f103
  crystal_mhz: 8
  bootloader_kib: 28
  menuconfig_extra: [Disable SWD at startup]
interfaces:
- usb-serial
usb_serial:
  chip: CH340
  serial_path: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
firmware:
  interface: Serial (on USART1 PA10/PA9)
  flash: >-
    Copy out/klipper.bin to an SD card (rename it to something new ending in .bin; the board
    skips a file name it has already flashed) and power the printer on with the card inserted.
power:
  vin_v: [24, 24]
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PC2
  dir_pin: PB9
  enable_pin: '!PC3'
  onboard_driver: &drv
    chip: null
    standalone: true
    microsteps: 16
    note: Standalone driver (no UART/SPI). The chip varies by batch; current is set by the board.
- id: Y
  step_pin: PB8
  dir_pin: PB7
  enable_pin: '!PC3'
  onboard_driver: *drv
- id: Z
  step_pin: PB6
  dir_pin: PB5
  enable_pin: '!PC3'
  onboard_driver: *drv
- id: E
  step_pin: PB4
  dir_pin: PB3
  enable_pin: '!PC3'
  onboard_driver: *drv
endstops:
- id: X-STOP
  pin: PA5
- id: Y-STOP
  pin: PA6
- id: Z-STOP
  pin: PA7
heaters:
- id: HEATER
  pin: PA1
  role: hotend
- id: HOTBED
  pin: PA2
  role: bed
  drive: dc
thermistors:
- id: TH0
  pin: PC5
  typical_use: hotend
- id: TB
  pin: PC4
  typical_use: bed
fans:
- id: FAN
  pin: PA0
probe_ports: []
bltouch:
  sensor_pin: PB1
  control_pin: PB0
filament_sensor_ports:
- id: FIL
  pin: PA4
notes:
- All four drivers share one enable pin (PC3); Klipper allows that.
- Drivers are standalone, so run current is not set from Klipper and sensorless homing is not possible.
- Hotend and board fans are wired to 24 V and always on; only FAN (part cooling) is switchable.
unverified:
- crystal_mhz 8 is Klipper's STM32F103 default; neither source states the board's crystal.
- Thermistor pull-ups are not stated in either source; Klipper's default 4.7k is used, as in Klipper's configs.
discrepancies:
- 'MCU: STM32F103 on earlier boards, GD32F103 on later ones (Klipper ender3pro-2020 config, Marlin
  BOARD_CREALITY_V422_GD32_MFL). Check the chip marking.'
sources:
