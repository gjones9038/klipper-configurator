probe_ports:
- id: HV_IN
  pin: PF3
  protected: true
  supply_v:
  - 5
  - 12
  - 24
  note: 'High-voltage input for inductive probes (Mellow: "1个高压IN口"). Shares DIAG7 (jumper from v1.2). IO supply
    5/12/24 V by jumper.'
- id: PROBE
  pin: PC3
  supply_v:
  - 5
  note: Probe pin of the BLTOUCH header (GND, 5V, PC6, GND, PC3).
bltouch:
  sensor_pin: PC3
  control_pin: PC6
neopixel_ports: []
notes:
- "Version 1.0 boards have a faulty CAN power supply: connect a 1.0 board by USB, not CAN."
- "If you plug an endstop switch into a driver's IO/DIAG input, take that driver's DIAG jumper off."
- "There is no RGB light header on this board."
tech_notes:
- "Revisions (Mellow README): 1.1 fixed the CAN chip supply, 1.2 added the DIAG7 jumper, 1.3 made the WiFi module removable. Pins are unchanged."
- "On 1.0 the CAN transceiver supply is faulty (fixed in 1.1): use USB on a 1.0 board."
- "Pins: Mellow pin diagram (Super8 v1.3), Mellow sample config (Trident; drivers 0, 1, 3, 4, 5) and the community pin table (v1.2) agree. Drivers 2, 6, 7 come from the diagram and the community table."
- "DIAG0-6 share the IO0-IO6 inputs; DIAG7 shares HV IN. With physical endstops on stepsticks, remove the DIAG jumper of that driver."
- "Thermistor pull-ups are not stated; the Mellow sample sets no pullup_resistor (Klipper default 4.7k)."
- "No RGB/neopixel header on the diagram."
unverified:
- probe pin polarity (no modifier in the sources beyond the sample's ^PF3)
- thermistor pull-up values
- fan port voltage selection
