# Imported from https://github.com/Klipper3d/klipper config/printer-twotrees-sapphire-pro-sp-3-2020.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: twotrees-sapphire-pro-board
name: Two Trees Sapphire Pro (SP-3) mainboard
manufacturer: Two Trees
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f103, crystal_mhz: 8, bootloader_kib: 28, check_dict: stm32f103-usart3}
interfaces: [usb-serial]
firmware: {interface: Serial (on USART3 PB11/PB10), flash: 'INSTRUCTIONS FOR FLASHING, THE SCRIPT IS COMPULSORY OR IT WON''T
    WORK!!! Note that the "make flash" command does not work with the Robin Nano! After running "make", run the following
    command in one row FROM THE KLIPPER FOLDER: ./scripts/update_mks_robin.py out/klipper.bin out/Robin_nano35.bin Copy the
    file out/Robin_nano35.bin (if you can''t find the file the script was not executed) to an SD card and then restart the
    printer with that SD card. If you removed the LCD screen rename the file to "Robin_nano43.bin" for correct flashing.'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PE3
  dir_pin: PE2
  enable_pin: '!PE4'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Y
  step_pin: PE0
  dir_pin: PB9
  enable_pin: '!PE1'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Z
  step_pin: PB5
  dir_pin: PB4
  enable_pin: '!PB8'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: E
  step_pin: PD6
  dir_pin: PD3
  enable_pin: '!PB3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
endstops:
- {id: X-STOP, pin: PA15, modifier: '!'}
- {id: Y-STOP, pin: PA12, modifier: '!'}
- {id: Z-STOP, pin: PA11, modifier: '!'}
heaters:
- {id: HEATER, pin: PC3, role: hotend}
- {id: BED, pin: PA0, role: bed}
thermistors:
- {id: TH0, pin: PC1, typical_use: hotend}
- {id: TB, pin: PC0, typical_use: bed}
fans:
- {id: FAN0, pin: PB0, typical_use: hotend}
- {id: FAN1, pin: PB1, typical_use: part_cooling}
probe_ports: []
notes: ['The motor drivers on this board can''t be adjusted from Klipper. Motor current is set on the board, and sensorless
    homing (homing without switches) isn''t possible.']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
