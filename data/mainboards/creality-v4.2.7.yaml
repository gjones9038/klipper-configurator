schema: mainboard/1
id: creality-v4.2.7
name: Creality
manufacturer: Creality
revisions:
- v4.2.7
status: reviewed
# "Silent" board shipped in Ender 3 / 3 Pro / 3 V2 printers. Same as the v4.2.2 except that
# every driver's step and dir pins are swapped (Klipper generic-creality-v4.2.7.cfg, Marlin
# pins_CREALITY_V427.h).
mcu_variants:
- chip: stm32f103
  crystal_mhz: 8
  bootloader_kib: 28
interfaces:
- usb-serial
usb_serial:
  chip: CH340
  serial_path: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
firmware:
  interface: Serial (on USART1 PA10/PA9)
  flash: >-
    Copy out/klipper.bin to an SD card (rename it to something new ending in .bin; the board
    skips a file name it has already flashed) and power the printer on with the card inserted.
power:
  vin_v: [24, 24]
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PB9
  dir_pin: PC2
  enable_pin: '!PC3'
  onboard_driver: &drv
    chip: null
    standalone: true
    microsteps: 16
    note: Standalone driver (no UART/SPI); current is set by the board.
- id: Y
  step_pin: PB7
  dir_pin: PB8
  enable_pin: '!PC3'
  onboard_driver: *drv
- id: Z
  step_pin: PB5
  dir_pin: PB6
  enable_pin: '!PC3'
  onboard_driver: *drv
- id: E
  step_pin: PB3
  dir_pin: PB4
  enable_pin: '!PC3'
  onboard_driver: *drv
endstops:
- id: X-STOP
  pin: PA5
- id: Y-STOP
  pin: PA6
- id: Z-STOP
  pin: PA7
heaters:
- id: HEATER
  pin: PA1
  role: hotend
- id: HOTBED
  pin: PA2
  role: bed
  drive: dc
thermistors:
- id: TH0
  pin: PC5
  typical_use: hotend
- id: TB
  pin: PC4
  typical_use: bed
fans:
- id: FAN
  pin: PA0
probe_ports: []
bltouch:
  sensor_pin: PB1
  control_pin: PB0
filament_sensor_ports:
- id: FIL
  pin: PA4
notes:
- All four drivers share one enable pin (PC3); Klipper allows that.
- Drivers are standalone, so run current is not set from Klipper and sensorless homing is not possible.
- Hotend and board fans are wired to 24 V and always on; only FAN (part cooling) is switchable.
unverified:
- The driver chip (often quoted as TMC2225) is not named in either source; it does not change the config.
- crystal_mhz 8 is Klipper's STM32F103 default; neither source states the board's crystal.
- Thermistor pull-ups are not stated in either source; Klipper's default 4.7k is used, as in Klipper's configs.
sources:
- repo: https://github.com/Klipper3d/klipper
  path: config/generic-creality-v4.2.7.cfg
  commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
- repo: https://github.com/MarlinFirmware/Marlin
  path: Marlin/src/pins/stm32f1/pins_CREALITY_V427.h
  commit: f5fa1edb9461c402dda88da01cc421d1e485675c
  note: swaps step/dir, then includes pins_CREALITY_V4.h (endstops, heaters, fan, BLTouch PB1/PB0, FIL_RUNOUT PA4)
- repo: https://github.com/Klipper3d/klipper
  path: config/printer-creality-ender3-v2-neo-2022.cfg
  commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
  note: bltouch pins (from the shared V4 layout)
