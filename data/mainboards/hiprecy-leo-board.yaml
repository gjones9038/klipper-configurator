# Imported from https://github.com/Klipper3d/klipper config/printer-hiprecy-leo-2019.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: hiprecy-leo-board
name: Hiprecy Leo mainboard
manufacturer: Hiprecy
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: atmega2560, arch: avr, cpu_mhz: 16}
interfaces: [usb-serial]
usb_serial: {chip: CH340, serial_path: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}
firmware: {interface: 'Serial (UART0), 250000 baud (Klipper''s AVR default)'}
tmc_spi: {default: true}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PF0
  dir_pin: PF1
  enable_pin: '!PD7'
  onboard_driver: {chip: tmc2130, klipper_section: tmc2130}
  spi_cs_pin: PG4
  diag_pin: PK1
  diag_pin_key: diag1_pin
  diag_modifier: ^!
- id: Y
  step_pin: PF6
  dir_pin: PF7
  enable_pin: '!PF2'
  onboard_driver: {chip: tmc2130, klipper_section: tmc2130}
  spi_cs_pin: PG2
  diag_pin: PJ1
  diag_pin_key: diag1_pin
  diag_modifier: ^!
- id: Z
  step_pin: PL6
  dir_pin: PL1
  enable_pin: '!PF4'
  onboard_driver: {chip: tmc2130, klipper_section: tmc2130}
  spi_cs_pin: PJ7
- id: E
  step_pin: PA4
  dir_pin: PA6
  enable_pin: '!PA2'
  onboard_driver: {chip: tmc2130, klipper_section: tmc2130}
  spi_cs_pin: PL2
  diag_pin: PE4
  diag_pin_key: diag1_pin
  diag_modifier: ''
endstops: []
heaters:
- {id: HEATER, pin: PE3, role: hotend}
- {id: BED, pin: PH5, role: bed}
thermistors:
- {id: TH0, pin: PK4, typical_use: hotend}
- {id: TB, pin: PK7, typical_use: bed}
fans:
- {id: FAN0, pin: PL5, typical_use: part_cooling}
- id: FAN1
  pin: PL4
  typical_use: hotend
  klipper: {cycle_time: '0.010', max_power: '1.0', shutdown_speed: '0'}
probe_ports:
- {id: PROBE, pin: PB6, modifier: ''}
setup_sections:
- section: static_digital_output disable_sdcard
  why: fixed board output from Klipper's config
  klipper: {pins: PB0}
notes: []
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k).]
sources:
- {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-hiprecy-leo-2019.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
