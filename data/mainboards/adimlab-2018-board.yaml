schema: mainboard/1
id: adimlab-2018-board
name: ADIMLab 3D printer (2018) mainboard
manufacturer: ADIMLab
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: atmega2560, arch: avr, cpu_mhz: 16}
interfaces: [usb-serial]
firmware: {interface: 'Serial (UART0), 250000 baud (Klipper''s AVR default)'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PA3
  dir_pin: PA1
  enable_pin: '!PA5'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Y
  step_pin: PC5
  dir_pin: PC4
  enable_pin: '!PC6'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Z
  step_pin: PC2
  dir_pin: PC1
  enable_pin: '!PC3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: E
  step_pin: PL7
  dir_pin: PL6
  enable_pin: '!PC0'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
endstops:
- {id: X-STOP, pin: PA0, modifier: ^!}
- {id: Y-STOP, pin: PA4, modifier: ^!}
- {id: Z-STOP, pin: PA7, modifier: ^!}
heaters:
- {id: HEATER, pin: PE4, role: hotend}
- {id: BED, pin: PG5, role: bed}
thermistors:
- {id: TH0, pin: PK0, typical_use: hotend}
- {id: TB, pin: PK2, typical_use: bed}
fans: []
probe_ports: []
notes: ['The motor drivers on this board can''t be adjusted from Klipper. Motor current is set on the board, and sensorless
    homing (homing without switches) isn''t possible.']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k).]
