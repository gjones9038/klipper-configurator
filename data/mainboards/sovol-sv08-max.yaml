schema: mainboard/1
id: sovol-sv08-max
name: Sovol SV08 Max mainboard
manufacturer: Sovol
revisions:
- stock
status: needs-review
# The SV08 Max's own board: a host computer and an STM32H750 printer MCU. The MCU runs as a
# USB-to-CAN bridge; the toolhead board and the filament buffer are on its CAN bus.
mcu_variants:
- chip: stm32h750
  crystal_mhz: 25
  bootloader_kib: 0
  bootloader_note: Sovol's shipped build has no bootloader
  check_dict: stm32h750-usbcan-PB8PB9
interfaces:
- usb-can-bridge
can_pins: PB8/PB9
firmware:
  flash: "Sovol's own firmware build has no bootloader, and Sovol has not published how to flash this board. Ask Sovol before replacing its firmware."
power:
  vin_v: [24, 24]
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PE1
  dir_pin: PD7
  enable_pin: '!PD5'
  onboard_driver: &hv
    chip: tmc5160
    klipper_section: tmc5160
    sense_resistor: 0.05
  spi_cs_pin: PE0
  spi_software: &spi {sclk_pin: PB4, mosi_pin: PB6, miso_pin: PB5}
- id: Y
  step_pin: PD3
  dir_pin: PD2
  enable_pin: '!PD0'
  onboard_driver: *hv
  spi_cs_pin: PD4
  spi_software: *spi
- id: Z1
  step_pin: PA8
  dir_pin: PC9
  enable_pin: '!PA10'
  onboard_driver: &drv
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.15
  uart_pin: PA9
  uart_address: 3
- id: Z2
  step_pin: PC6
  dir_pin: PD15
  enable_pin: '!PC8'
  onboard_driver: *drv
  uart_pin: PC7
  uart_address: 3
- id: Z3
  step_pin: PA5
  dir_pin: PA4
  enable_pin: '!PA7'
  onboard_driver: *drv
  uart_pin: PA6
  uart_address: 3
- id: Z4
  step_pin: PB13
  dir_pin: PB12
  enable_pin: '!PB15'
  onboard_driver: *drv
  uart_pin: PB14
  uart_address: 3
endstops:
- id: Y-STOP
  pin: PD1
  note: "PD1, GND, 5V header; Sovol's Y endstop"
- id: PD6
  pin: PD6
  note: "PD6, GND, 5V header; not used by Sovol's config"
heaters:
- id: BED
  pin: PD12
  role: bed
thermistors:
- id: TB
  pin: PC5
  typical_use: bed
fans:
- id: K_FAN1
  pin: PB0
  tachometer_pin: PB1
  note: "Sovol's auxiliary part fan (fan2, M106 P2)"
- id: K_FAN2
  pin: PE11
  tachometer_pin: PE13
  typical_use: exhaust
  note: "Sovol's exhaust fan (fan3)"
- id: K_FAN3
  pin: PE14
  tachometer_pin: PB10
  tachometer_ppr: 2
  typical_use: controller
  note: "Sovol's bed_fan: on while the bed is above 35 C"
probe_ports: []
misc:
  main_led: PD13
notes:
- "The extruder, hotend, part fans, X endstop and the probe connect to the SV08 Max's own toolhead board."
- "This board talks to the printer's built-in computer over USB and passes CAN bus on to the toolhead board."
tech_notes:
- "MCU STM32H750 from Sovol's klipper/.config750: 25 MHz crystal, no bootloader (flash start 0x0000), USB to CAN bridge on PA11/PA12, CAN on PB8/PB9 at 1000000."
- "Sovol's .config750 sets CLOCK_FREQ 400000000; standard Klipper runs the H750 at 480 MHz."
- "X and Y drivers are TMC5160s on software SPI (SCK PB4, MOSI PB6, MISO PB5), sense resistor 0.05 ohm."
discrepancies:
- "Sovol's pin sheet gives the first Z socket as EN PA9 / UART PA6 (PA6 is also the third Z socket's UART); Sovol's printer.cfg uses EN !PA10 / UART PA9. Using the printer.cfg pins."
unverified:
- Only Sovol's sources (config, firmware build settings and pin sheet); Klipper has no SV08 Max config.
- Which Z socket drives which corner is not stated by Sovol; the order follows Sovol's config.
- K_FAN3's purpose ("bed_fan") is not described further by Sovol.
sources:
- {repo: https://github.com/Sovol3d/SV08MAX, path: home/sovol/printer_data/config/printer.cfg, commit: 68c28ea4ef5a81279d69c0e7d3b6433f0945192b}
- {repo: https://github.com/Sovol3d/SV08MAX, path: Motherboard/Mcu_Pin_definition.pdf, commit: 68c28ea4ef5a81279d69c0e7d3b6433f0945192b}
- {repo: https://github.com/Sovol3d/SV08MAX, path: home/sovol/klipper/.config750, commit: 68c28ea4ef5a81279d69c0e7d3b6433f0945192b, note: "STM32H750, 25 MHz, no bootloader, USB-CAN bridge, CAN PB8/PB9"}
- {repo: https://github.com/Sovol3d/SV08MAX, path: home/sovol/printer_data/config/Macro.cfg, commit: 68c28ea4ef5a81279d69c0e7d3b6433f0945192b, note: "M106 P2 drives fan2; main_led macros"}
