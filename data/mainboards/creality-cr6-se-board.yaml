# Imported from Klipper's config/printer-creality-cr6se-2021.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: creality-cr6-se-board
name: Creality CR-6 SE (4.5.3 board) mainboard
manufacturer: Creality
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f103, crystal_mhz: 8, bootloader_kib: 28, check_dict: stm32f103-serial}
interfaces: [usb-serial]
usb_serial: {chip: CH340, serial_path: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}
firmware: {interface: Serial (on USART1 PA10/PA9), flash: Flash this firmware by copying "out/klipper.bin" to a SD card and
    turning on the printer with the card inserted. The firmware filename must end in ".bin" and must not match the last filename
    that was flashed.}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PB8
  dir_pin: PB7
  enable_pin: '!PC3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Y
  step_pin: PB6
  dir_pin: PB5
  enable_pin: '!PC3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: Z
  step_pin: PB4
  dir_pin: PB3
  enable_pin: '!PC3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
- id: E
  step_pin: PC2
  dir_pin: PB9
  enable_pin: '!PC3'
  onboard_driver: {chip: null, standalone: true, microsteps: 16, note: 'No TMC section in Klipper''s config: Klipper does
      not set this driver''s current.'}
endstops:
- {id: X-STOP, pin: PC4, modifier: ''}
- {id: Y-STOP, pin: PC5, modifier: ''}
heaters:
- {id: HEATER, pin: PB14, role: hotend}
- {id: BED, pin: PB13, role: bed}
thermistors:
- {id: TH0, pin: PB1, typical_use: hotend}
- {id: TB, pin: PB0, typical_use: bed}
fans:
- {id: FAN0, pin: PB15, typical_use: part_cooling}
probe_ports:
- {id: PROBE, pin: PA4, modifier: ''}
notes: ['The motor drivers on this board can''t be adjusted from Klipper. Motor current is set on the board, and sensorless
    homing (homing without switches) isn''t possible.']
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
sources:
