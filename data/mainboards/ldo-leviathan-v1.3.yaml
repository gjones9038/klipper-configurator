schema: mainboard/1
id: ldo-leviathan-v1.3
name: LDO Leviathan
manufacturer: LDO
revisions:
- '1.3'
status: needs-review
# V1.3 moves to an STM32H743 (25 MHz crystal). Pins are the same as V1.2; LDO's manual pin table,
# LDO's KiCad board file and TeamGloomy's RepRapFirmware board file agree on every pin.
mcu_variants:
- chip: stm32h743
  crystal_mhz: 25
  bootloader_kib: 128
  bootloader_note: LDO ships it with Katapult at 128KiB
interfaces:
- usb
- usb-can-bridge
can_pins: PB5/PB6
power:
  vin_v:
  - 18
  - 28
  hv_v:
  - 24
  - 55
driver_mount: onboard
tmc_spi:
  bus: spi4
driver_slots:
- id: HV-STEPPER-0
  step_pin: PB10
  dir_pin: PB11
  enable_pin: '!PG0'
  onboard_driver:
    chip: tmc5160
    klipper_section: tmc5160
    sense_resistor: 0.075
    max_current_a: 3.0
    motor_power: HV input, 24-55V (48V typical)
  spi_cs_pin: PE15
  spi_bus: spi4
  diag_pin: PG1
  diag_pin_key: diag0_pin
  diag_modifier: ^!
- id: HV-STEPPER-1
  step_pin: PF15
  dir_pin: PF14
  enable_pin: '!PE9'
  onboard_driver:
    chip: tmc5160
    klipper_section: tmc5160
    sense_resistor: 0.075
    max_current_a: 3.0
    motor_power: HV input, 24-55V (48V typical)
  spi_cs_pin: PE11
  spi_bus: spi4
  diag_pin: PE10
  diag_pin_key: diag0_pin
  diag_modifier: ^!
- id: STEPPER-0
  step_pin: PD4
  dir_pin: PD3
  enable_pin: '!PD7'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PD5
  diag_pin: PD6
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-1
  step_pin: PC12
  dir_pin: PC11
  enable_pin: '!PD2'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PD0
  diag_pin: PD1
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-2
  step_pin: PC9
  dir_pin: PC8
  enable_pin: '!PC10'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PA8
  diag_pin: PA15
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-3
  step_pin: PG7
  dir_pin: PG6
  enable_pin: '!PC7'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PG8
  diag_pin: PC6
  diag_pin_key: diag_pin
  diag_modifier: ^!
- id: STEPPER-4
  step_pin: PD10
  dir_pin: PD9
  enable_pin: '!PD13'
  onboard_driver:
    chip: tmc2209
    klipper_section: tmc2209
    sense_resistor: 0.11
    max_current_a: 2.0
  uart_pin: PD11
endstops:
- id: X-ENDSTOP
  pin: PC1
- id: Y-ENDSTOP
  pin: PC2
- id: Z-ENDSTOP
  pin: PC3
heaters:
- id: HEATER
  pin: PG10
  role: hotend
- id: HEATBED
  pin: PG11
  role: bed
thermistors:
- id: TH0
  pin: PA1
  pullup_ohms: 2200
- id: TH1
  pin: PA2
  pullup_ohms: 2200
- id: TH2
  pin: PA0
  pullup_ohms: 2200
- id: TH3
  pin: PA3
  pullup_ohms: 2200
fans:
- id: FAN0
  pin: PB7
  tachometer_pin: PB8
  wires: 3
  voltage_options: &id001
  - 5
  - 24
  voltage_select: per-port jumper
- id: FAN1
  pin: PB3
  tachometer_pin: PB4
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
- id: FAN2
  pin: PF7
  tachometer_pin: PF6
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
- id: FAN3
  pin: PF9
  tachometer_pin: PF8
  wires: 3
  voltage_options: *id001
  voltage_select: per-port jumper
probe_ports:
- id: Z-PROBE
  pin: PF1
  modifier: ^
  protected: true
  note: Selectable voltage, integrated diode (vendor README). LDO config uses ^PF1.
neopixel_ports:
- id: RGB
  pin: PF10
filament_sensor_ports:
- id: FIL0
  pin: PC0
misc:
  caselight_pin: PE6
  led_strip: LED-Strip (PE6), flicker-free dimming
extensions:
- id: ldo-leviathan-ext
  name: LDO Leviathan Extension Board
  revisions:
  - '1.1'
  status: needs-review
  connects: 30-pin extension port on the Leviathan (SPI2 + GPIO); powered from the Leviathan HV input
  note: Adds 2 more motor sockets (9 in all), 2 fan ports and 2 thermistor inputs. That's enough sockets for AWD (four X/Y motors).
  driver_slots:
  - id: EXT-HV-STEPPER-2
    label: HV STEPPER 2 (extension)
    step_pin: PD15
    dir_pin: PD14
    enable_pin: '!PG2'
    onboard_driver:
      chip: tmc5160
      klipper_section: tmc5160
      sense_resistor: 0.075
      max_current_a: 3.0
      motor_power: HV input, 24-55V (48V typical)
    spi_cs_pin: PB12
    spi_bus: spi2
    diag_pin: PG3
    diag_pin_key: diag0_pin
    diag_modifier: ^!
  - id: EXT-HV-STEPPER-3
    label: HV STEPPER 3 (extension)
    step_pin: PG4
    dir_pin: PE8
    enable_pin: '!PB0'
    onboard_driver:
      chip: tmc5160
      klipper_section: tmc5160
      sense_resistor: 0.075
      max_current_a: 3.0
      motor_power: HV input, 24-55V (48V typical)
    spi_cs_pin: PG5
    spi_bus: spi2
    diag_pin: PE7
    diag_pin_key: diag0_pin
    diag_modifier: ^!
  fans:
  - id: EXT-FAN4
    pin: PF5
    tachometer_pin: PF4
    wires: 3
    voltage_options:
    - 12
    - 24
    voltage_select: one FAN_V rail for both ports (schematic), 12 or 24 V
  - id: EXT-FAN5
    pin: PF3
    tachometer_pin: PF2
    wires: 3
    voltage_options:
    - 12
    - 24
    voltage_select: one FAN_V rail for both ports (schematic), 12 or 24 V
  thermistors:
  - id: EXT-TH4
    pin: PC4
    pullup_ohms: 2200
  - id: EXT-TH5
    pin: PC5
    pullup_ohms: 2200
  buzzer:
    id: BUZZER
    pin: PB1
    kind: passive     # README "piezo buzzer"; LDO drives it as pwm_cycle_time (pitch = cycle time)
  notes:
  - "The two extra AWD motors plug into HV STEPPER 2 (front-right motor) and HV STEPPER 3 (front-left motor), as in LDO's own setup."
  - "The buzzer can beep: type M300 S1000 P200 in the console for a 1 kHz beep lasting 0.2 seconds."
  tech_notes:
  - "LDO's config puts stepper_x1 (B1) on HV STEPPER 2 and stepper_y1 (A1) on HV STEPPER 3; the generator does the same."
  - "The extension's drivers sit on SPI2, the Leviathan's own on SPI4."
  - "The buzzer (PB1) is set up as [pwm_cycle_time _beeper] with an M300 macro, as in LDO's config; the macro follows Klipper's config/sample-macros.cfg. Unless turned off (build beeps: false), PRINT_END plays a tune and PAUSE beeps via the Mainsail/Fluidd user_pause_macro hook."
  unverified:
  - Only LDO sources (config and schematic, which agree on every pin); Klipper has no config for this board, so it stays needs-review.
  - Fan voltage: README says 12V/24V selectable; the schematic has one FAN_V rail for both ports. The selector itself was not identified.
  sources:
  - repo: https://github.com/MotorDynamicsLab/LeviathanExt
    path: Klipper_config/v2t_leviathan_ext.cfg
    commit: 060af34d9eecc6e967473f04f5e677e55a51dda8
  - repo: https://github.com/MotorDynamicsLab/LeviathanExt
    path: Schematic/Leviathan_Ext_V1.1.pdf
    commit: 060af34d9eecc6e967473f04f5e677e55a51dda8
    note: net names STEP/DIR/EN/CS/DIAG_DRV_HV2/HV3, PWM_FAN4/5, TACH4/5, TH4/5, PWM_BUZZER match the config's pins
  - repo: https://github.com/MotorDynamicsLab/LeviathanExt
    path: README.md
    commit: 060af34d9eecc6e967473f04f5e677e55a51dda8
  - repo: https://github.com/Klipper3d/klipper
    path: config/sample-macros.cfg
    commit: 9cb99754c035b90206ef0a02660f674fc9517e9b
    note: M300 beeper macro (pwm_cycle_time pin, SET_PIN VALUE=0.5 CYCLE_TIME=1/S)
  - repo: https://github.com/MotorDynamicsLab/Leviathan
    path: Media/extensionport.jpg
    commit: 878c3c4893ea353552c957f574509f9890e1e37a
    note: extension port pinout (all 20 signal pins match)
exp_aliases:
  EXP1_1: PG9
  EXP1_2: PG12
  EXP1_3: PG13
  EXP1_4: PG14
  EXP1_5: PC13
  EXP1_6: PC14
  EXP1_7: PC15
  EXP1_8: PF0
  EXP1_9: <GND>
  EXP1_10: <5V>
  EXP2_1: PA6
  EXP2_2: PA5
  EXP2_3: PE2
  EXP2_4: PE4
  EXP2_5: PE3
  EXP2_6: PA7
  EXP2_7: PE5
  EXP2_8: <RST>
  EXP2_9: <GND>
  EXP2_10: PE4
notes:
- "The two high-voltage sockets (HV-STEPPER-0 and HV-STEPPER-1) are for the main X and Y motors. They only work with the separate high-voltage power input connected."
tech_notes:
- "Thermistor pull-ups are 2.2k: every thermistor section needs ''pullup_resistor: 2200''."
- "HV-STEPPER-0/1 (TMC5160) are intended for A/B; they need the HV input powered."
- "Firmware: STM32H743, 128KiB bootloader (Katapult), 25 MHz crystal, USB on PA11/PA12, or USB to CAN bus bridge with CAN on PB5/PB6 (LDO's menuconfig screenshots)."
- "The TMC5160s (HV-STEPPER-0/1) are on spi4 (PE12/PE13/PE14), the same pins and Klipper bus name as on V1.2."
- "The extension port pinout (manual page 10) is the same as on V1.2, so the Leviathan Extension Board fits."
- "The Pi UART (PA9/PA10) also works, but then the USB-CAN bridge is not available (manual); this tool sets up USB or the bridge."
checks:
- "The V1.3 board has an STM32H743 chip; the V1.2 has an STM32F446. Pick the one that matches the chip on your board: the firmware is different."
unverified:
- "Input settings not given by the V1.3 sources (probe pull-up ^PF1, DIAG ^!) follow LDO's V1.2 config; the pins are identical."
- "All three sources trace back to LDO's design (the RepRapFirmware file is an independent firmware port); Klipper and Voron have no V1.3 config yet, so it stays needs-review."
