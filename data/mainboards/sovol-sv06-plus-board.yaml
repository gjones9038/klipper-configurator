# Imported from https://github.com/Klipper3d/klipper config/printer-sovol-sv06-plus-2023.cfg by tools/import_klipper_printer.py.
schema: mainboard/1
id: sovol-sv06-plus-board
name: Sovol SV06 Plus mainboard
manufacturer: Sovol
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: stm32f103, crystal_mhz: 8, bootloader_kib: 28, check_dict: stm32f103-serial}
interfaces: [usb-serial]
usb_serial: {chip: CH340, serial_path: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}
firmware: {interface: Serial (on USART1 PA10/PA9), flash: 'Also, since it is using the GD32F103, please select Disable SWD
    at startup  Flash this firmware by copying "out/klipper.bin" to a SD card and turning on the printer with the card inserted.
    The firmware filename must end in ".bin" and must not match the last filename that was flashed.'}
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PC2
  dir_pin: PB9
  enable_pin: '!PC3'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PC1
  uart_address: 3
  diag_pin: PA5
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: Y
  step_pin: PB8
  dir_pin: PB7
  enable_pin: '!PC3'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PC0
  uart_address: 3
  diag_pin: PA6
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: Z
  step_pin: PB6
  dir_pin: PB5
  enable_pin: '!PC3'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PA15
  uart_address: 3
  diag_pin: PA7
  diag_pin_key: diag_pin
  diag_modifier: ''
- id: E
  step_pin: PB4
  dir_pin: PB3
  enable_pin: '!PC3'
  onboard_driver: {chip: tmc2209, klipper_section: tmc2209, sense_resistor: 0.15}
  uart_pin: PC14
  uart_address: 3
endstops: []
heaters:
- {id: HEATER, pin: PA1, role: hotend}
- {id: BED, pin: PA2, role: bed}
thermistors:
- {id: TH0, pin: PC5, typical_use: hotend}
- {id: TB, pin: PC4, typical_use: bed}
fans:
- {id: FAN0, pin: PA0, typical_use: part_cooling}
probe_ports:
- {id: PROBE, pin: PB1, modifier: ''}
filament_sensor_ports:
- {id: FIL, pin: PA4}
notes: []
unverified: [Only one source (Klipper's reference config for this printer). Check the pins against your board before powering
    on., Thermistor pull-ups not given in the source use Klipper's default (4.7k)., crystal_mhz 8 is Klipper's default; the
    source does not state it.]
sources:
- {repo: 'https://github.com/Klipper3d/klipper', path: config/printer-sovol-sv06-plus-2023.cfg, commit: 9cb99754c035b90206ef0a02660f674fc9517e9b}
