  amp:
    chip: MAX31865
    klipper: {spi_bus: usart0, rtd_nominal_r: '100', rtd_reference_r: '400', rtd_num_of_wires: '2', rtd_use_50hz_filter: 'True'}
fans:
- {id: FAN0, pin: PC23, typical_use: part_cooling}
probe_ports: []
bltouch: {sensor_pin: PC1, control_pin: PC3}
filament_sensor_ports:
- {id: FIL, pin: PD10}
- {id: FIL1, pin: PC16}
notes: []
