schema: mainboard/1
id: modix-big60-board
name: Modix Big60 (Duet 2 WiFi) mainboard
manufacturer: Modix
revisions: [stock]
status: needs-review
stock_only: true
mcu_variants:
- {chip: sam4e8e, crystal_mhz: 8, bootloader_kib: 0}
interfaces: [usb]
driver_mount: onboard
driver_slots:
- id: X
  step_pin: PD6
  dir_pin: PD11
  enable_pin: '!PC6'
  onboard_driver: {chip: tmc2660, klipper_section: tmc2660, sense_resistor: 0.051}
  spi_cs_pin: PD14
  spi_speed: 2000000
  spi_bus: usart1
- id: Y
  step_pin: PD7
  dir_pin: PD12
  enable_pin: '!PC6'
  onboard_driver: {chip: tmc2660, klipper_section: tmc2660, sense_resistor: 0.051}
  spi_cs_pin: PC9
  spi_speed: 2000000
  spi_bus: usart1
- id: Z
  step_pin: PD8
  dir_pin: PD13
  enable_pin: '!PC6'
  onboard_driver: {chip: tmc2660, klipper_section: tmc2660, sense_resistor: 0.051}
  spi_cs_pin: PC10
  spi_speed: 2000000
  spi_bus: usart1
- id: E
  step_pin: PD5
  dir_pin: PA1
  enable_pin: '!PC6'
  onboard_driver: {chip: tmc2660, klipper_section: tmc2660, sense_resistor: 0.051}
  spi_cs_pin: PC17
  spi_speed: 2000000
  spi_bus: usart1
endstops:
- {id: X-STOP, pin: PC14, modifier: ^}
- {id: Y-STOP, pin: PA2, modifier: ^}
heaters:
- {id: HEATER, pin: '!PA20', role: hotend}
